openapi: 3.1.0
info:
  title: Pando API
  version: "1"
  summary: The /v1 API of the Pando Worker.
  description: |
    Owner: the server-git lane. Others ask pando-ops for changes.

    Shape:
    - Every route is under `/v1/monorepos/{monorepo}`. A monorepo holds
      repos. A plain git repo is a monorepo of kind `repo` holding exactly
      one repo, at path `.`, and no meta layer; it uses the same routes.
      The meta layer's routes (`/v1/monorepos/{monorepo}/meta/...`) are in
      `meta-sync.md`.
    - A repo has a `path` (as in `formats.md`: `projects/web`, or `.` in a
      plain repo) and a `name`, its id in URLs: the path with each `/`
      turned into `-` (`projects-web`). A plain repo's name is the
      monorepo's name. Names are unique in a monorepo; `meta` is reserved.
    - Git goes through the git door at the repo's `clone_url`,
      `https://<host>/<monorepo>/<name>.git` (smart HTTP; see the `git`
      tag). Pushes to the default branch are refused, except the first push
      that creates it. Every other push goes through.
    - Every other call is JSON with `Authorization: Bearer <credential>`.

    Artifacts repos, in the namespace `pando-dev`: a project repo is
    `<monorepo>--<name>` (`acme--projects-web`), a plain repo is
    `<monorepo>--<monorepo>`, and the meta layer is `<monorepo>--meta`.
    Artifacts allows letters, digits, `.`, `_` and `-`, starting with a
    letter or digit. Pando names forbid `--`, so the split is never
    ambiguous. These names are internal: clients use `clone_url`.

    Required checks: the server reads `required_checks` from
    `.pando/pando.toml` on main (`formats.md`, section 2). In a monorepo
    that is the meta layer's main, table `[repos."<repo path>"]`; in a plain
    repo, the repo's own main, table `[repos."."]`.

    Identity works like GitHub's. A person has a user account and belongs to
    monorepos as `owner` or `member`. A machine signs in once
    (`pando login`) and holds a credential for that user; git and every agent
    on the machine act as that user, the way `gh` and git credentials do. A
    cloud sandbox gets a credential its user makes for it. Credentials are
    listed and revocable. Commits are authored as the user; Pando's commit
    trailers name the agent.

    Any member may push, review, post statuses, report worktrees and merge
    (agents included, through the user's credential). Reviews are comments
    and approvals, not a gate. The merge gate is the checks, and `?force=1`
    merges past them. Owners also manage members and hooks.

    Signing in (`pando login`): WorkOS AuthKit's CLI Auth, the OAuth device
    flow, run through the Worker. `POST /v1/login/device` returns a code
    and a URL; the person confirms the code in the browser; the CLI polls
    `POST /v1/login/token` with the device code until it returns the user and
    a new machine credential. WorkOS only proves who the person is: Pando
    keeps its own users, credentials and membership, and keeps no WorkOS
    token. A user's login comes from their email (`ana@x.com` is `ana`, or
    `ana-2` if taken). Invites by email wait until that email first signs in.

    Self-hosted, one person: the Worker secret `PANDO_BOOTSTRAP` makes users
    with `POST /v1/users` (it works there only). Either way, a user then makes
    more credentials (`POST /v1/user/credentials`) and monorepos
    (`POST /v1/monorepos`).

    Branch names in paths: encode `/` as `%2F` (`agent-3%2Foauth`). Raw
    slashes are accepted too.

    Errors are JSON: `{"error": {"code": "...", "message": "..."}}`.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: https://pando-dev.{subdomain}.workers.dev
    variables:
      subdomain:
        default: example
security:
  - credential: []
tags:
  - name: git
    description: |
      The git door. Plain git clients use it; no Pando client is needed.

      ```
      GET  /{monorepo}/{repo}.git/info/refs?service=git-upload-pack
      GET  /{monorepo}/{repo}.git/info/refs?service=git-receive-pack
      POST /{monorepo}/{repo}.git/git-upload-pack
      POST /{monorepo}/{repo}.git/git-receive-pack
      ```

      Credentials: HTTP Basic with the user's credential as the password
      (any username; this is what `pando credential`, the git credential
      helper, supplies), or `Authorization: Bearer <credential>`. Without
      credentials the door answers 401 with `WWW-Authenticate: Basic`, so a
      credential helper is asked.

      Clone and fetch also accept the 30-minute read token from a hook
      delivery (`read_token`), so CI clones from `clone_url` with no
      credential of its own.

      Only members of the monorepo get through.

      Push rule (receive-pack). The door reads the command list before the
      pack. If any command updates or deletes the repo's default branch
      (`refs/heads/main`), it refuses the whole push with git's usual
      `! [remote rejected] main (main is protected; ...)` line. Creating main
      when it does not exist yet is allowed: that is the first push of
      `pando init`. Main moves only by a merge.

      The door records each pushed branch's head and, on its first push, its
      author (the user). Then it delivers the `branch.opened` and `push`
      hooks.
paths:
  /v1/users:
    post:
      operationId: createUser
      summary: Make a user and a first credential (bootstrap secret only; self-hosted, one person)
      tags: [users]
      security:
        - bootstrap: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [login]
              properties:
                login: { $ref: "#/components/schemas/Login" }
                name: { type: string, description: A display name. }
                email: { type: string, description: Used on merge commits. }
                credential_name: { type: string, description: "A name for the first credential, for example the machine name. Default `bootstrap`." }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [user, credential]
                properties:
                  user: { $ref: "#/components/schemas/User" }
                  credential: { $ref: "#/components/schemas/NewCredential" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503":
          description: "`bootstrap_not_configured`: the PANDO_BOOTSTRAP secret is not set."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/login/device:
    post:
      operationId: loginStart
      summary: "pando login, step 1: a code to confirm in the browser"
      description: |
        Starts WorkOS CLI Auth. Show `user_code` and `verification_uri` (or
        open `verification_uri_complete`). Keep `device_code` to yourself: it
        is what the CLI polls with. No credential needed.
      tags: [users]
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [device_code, user_code, verification_uri, expires_in, interval]
                properties:
                  device_code: { type: string }
                  user_code: { type: string, description: "For example `RRGQ-BJVS`." }
                  verification_uri: { type: string }
                  verification_uri_complete: { type: string }
                  expires_in: { type: integer, description: "Seconds, usually 300." }
                  interval: { type: integer, description: "Seconds between polls, usually 5." }
        "503":
          description: "`sign_in_not_configured`: WORKOS_CLIENT_ID is not set on this Worker (use the bootstrap path)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/login/token:
    post:
      operationId: loginPoll
      summary: "pando login, step 2 (polled): the user and a new machine credential"
      description: |
        Poll every `interval` seconds. Until the person confirms, the answer is
        400 with `error.code` `authorization_pending` (keep polling) or
        `slow_down` (add 5 seconds to the interval). `access_denied`,
        `expired_token` and `invalid_grant` end the attempt. On success,
        `joined` lists the monorepos whose email invites were accepted.
      tags: [users]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device_code, credential_name]
              properties:
                device_code: { type: string }
                credential_name: { type: string, description: "The machine name (formats.md, section 7)." }
                kind: { type: string, enum: [machine, sandbox], default: machine }
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                type: object
                required: [user, credential, joined]
                properties:
                  user: { $ref: "#/components/schemas/User" }
                  credential: { $ref: "#/components/schemas/NewCredential" }
                  joined:
                    type: array
                    items: { type: string }
        "400":
          description: "Not yet, or not at all: `error.code` is one of the codes above."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/user:
    get:
      operationId: me
      summary: The user behind the credential, and the credential itself
      tags: [users]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/User"
                  - type: object
                    required: [credential]
                    properties:
                      credential: { $ref: "#/components/schemas/Credential" }
        "401": { $ref: "#/components/responses/Error" }
  /v1/user/credentials:
    post:
      operationId: createCredential
      summary: Make a credential for this user (another machine, a cloud sandbox)
      description: The new credential acts as the same user. Its secret is shown once.
      tags: [users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, description: "The machine or sandbox, for example `ramos-mbp` or `sandbox-agent-3`." }
                kind: { type: string, enum: [machine, sandbox], default: machine }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NewCredential" }
    get:
      operationId: listCredentials
      summary: This user's credentials (no secrets)
      tags: [users]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [credentials]
                properties:
                  credentials:
                    type: array
                    items: { $ref: "#/components/schemas/Credential" }
  /v1/user/credentials/{credential_id}:
    parameters:
      - name: credential_id
        in: path
        required: true
        schema: { type: string }
    delete:
      operationId: revokeCredential
      summary: Revoke one of this user's credentials
      tags: [users]
      responses:
        "204": { description: Revoked }
        "404": { $ref: "#/components/responses/Error" }
  /v1/monorepos:
    post:
      operationId: createMonorepo
      summary: Create a monorepo; the caller becomes its owner
      tags: [monorepos]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { $ref: "#/components/schemas/Name" }
                kind:
                  type: string
                  enum: [monorepo, repo]
                  default: monorepo
                  description: |
                    `monorepo`: Pando also makes the meta layer's Artifacts repo
                    (`<name>--meta`, empty); add code repos with createRepo.
                    `repo`: a plain git repo; Pando makes its one repo (path `.`,
                    name = the monorepo's name) and returns it in `repos`.
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [monorepo, repos]
                properties:
                  monorepo: { $ref: "#/components/schemas/Monorepo" }
                  repos:
                    type: array
                    description: The plain repo for kind `repo`; empty for kind `monorepo`.
                    items: { $ref: "#/components/schemas/Repo" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    get:
      operationId: listMonorepos
      summary: The monorepos this user belongs to
      tags: [monorepos]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [monorepos]
                properties:
                  monorepos:
                    type: array
                    items: { $ref: "#/components/schemas/Monorepo" }
  /v1/monorepos/{monorepo}:
    parameters:
      - $ref: "#/components/parameters/monorepo"
    get:
      operationId: getMonorepo
      summary: Get a monorepo (members)
      tags: [monorepos]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Monorepo" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/monorepos/{monorepo}/members:
    parameters:
      - $ref: "#/components/parameters/monorepo"
    get:
      operationId: listMembers
      summary: The monorepo's members
      tags: [monorepos]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [members]
                properties:
                  members:
                    type: array
                    items: { $ref: "#/components/schemas/Member" }
  /v1/monorepos/{monorepo}/invites:
    parameters:
      - $ref: "#/components/parameters/monorepo"
    post:
      operationId: invite
      summary: Invite a person by email (owners)
      description: |
        If someone has already signed in with that email, they are added now
        (200, `status: added`). Otherwise the invite waits (201,
        `status: invited`) and is accepted when that email first signs in with
        `pando login` (a verified email only).
      tags: [monorepos]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string }
                role: { $ref: "#/components/schemas/MemberRole" }
      responses:
        "200":
          description: Added as a member now
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [added] }
                  member: { $ref: "#/components/schemas/Member" }
        "201":
          description: Invited; waiting for that email to sign in
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [invited] }
                  invite: { $ref: "#/components/schemas/Invite" }
        "403": { $ref: "#/components/responses/Error" }
    get:
      operationId: listInvites
      summary: Invites still waiting
      tags: [monorepos]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [invites]
                properties:
                  invites:
                    type: array
                    items: { $ref: "#/components/schemas/Invite" }
  /v1/monorepos/{monorepo}/invites/{email}:
    parameters:
      - $ref: "#/components/parameters/monorepo"
      - name: email
        in: path
        required: true
        schema: { type: string }
    delete:
      operationId: revokeInvite
      summary: Withdraw an invite (owners)
      tags: [monorepos]
      responses:
        "204": { description: Withdrawn }
        "404": { $ref: "#/components/responses/Error" }
  /v1/monorepos/{monorepo}/members/{login}:
    parameters:
      - $ref: "#/components/parameters/monorepo"
      - name: login
        in: path
        required: true
        schema: { $ref: "#/components/schemas/Login" }
    put:
      operationId: putMember
      summary: Add a user to the monorepo, or change their role (owners)
      tags: [monorepos]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { $ref: "#/components/schemas/MemberRole" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Member" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: removeMember
      summary: Remove a user from the monorepo (owners; the last owner stays)
      tags: [monorepos]
      responses:
        "204": { description: Removed }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/monorepos/{monorepo}/repos:
    parameters:
      - $ref: "#/components/parameters/monorepo"
    post:
      operationId: createRepo
      summary: Create a repo in a monorepo
      description: |
        Makes the Artifacts repo and records it. It starts empty; the first
        push to `main` through the door (`pando init`) creates main. Refused
        in a monorepo of kind `repo` (it already has its one repo).
      tags: [repos]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path:
                  type: string
                  description: The repo path from the root, for example `projects/web` (formats.md). Its `name` is the path with `/` turned into `-`.
                description: { type: string }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Repo" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    get:
      operationId: listRepos
      summary: List repos
      tags: [repos]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [repos]
                properties:
                  repos:
                    type: array
                    items: { $ref: "#/components/schemas/Repo" }
  /v1/monorepos/{monorepo}/repos/{repo}:
    parameters:
      - $ref: "#/components/parameters/monorepo"
      - $ref: "#/components/parameters/repo"
    get:
      operationId: getRepo
      summary: Get a repo
      tags: [repos]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Repo" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/monorepos/{monorepo}/repos/{repo}/branches:
    parameters:
      - $ref: "#/components/parameters/monorepo"
      - $ref: "#/components/parameters/repo"
    get:
      operationId: listBranches
      summary: List branches with head, base, author, ahead and behind, mergeable and checks
      description: The default branch is not in the list; its name and head are at the top.
      tags: [branches]
      parameters:
        - name: state
          in: query
          schema:
            type: string
            enum: [open, merged, all]
            default: open
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [default_branch, default_head, branches]
                properties:
                  default_branch: { type: string }
                  default_head:
                    type: [string, "null"]
                    description: null while the repo is empty.
                  branches:
                    type: array
                    items: { $ref: "#/components/schemas/Branch" }
    post:
      operationId: createBranch
      summary: Create a branch on the server, off main by default
      description: |
        Points a new branch at `from` (default: main's head) with no new
        commit. The caller becomes the branch's author. 409 `branch_exists` if
        it exists.
      tags: [branches]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, description: "A git branch name, for example `agent-3/oauth`. Not the default branch." }
                from: { type: string, description: "A branch name or a full sha. Default: the default branch." }
                title: { type: string }
                description: { type: string }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Branch" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/monorepos/{monorepo}/repos/{repo}/branches/{branch}:
    parameters:
      - $ref: "#/components/parameters/monorepo"
      - $ref: "#/components/parameters/repo"
      - $ref: "#/components/parameters/branch"
    get:
      operationId: getBranch
      summary: One branch, as in the list
      tags: [branches]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Branch" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateBranch
      summary: Set the branch's title and description
      description: The merge commit's message is the title and description.
      tags: [branches]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                description: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Branch" }
  /v1/monorepos/{monorepo}/repos/{repo}/branches/{branch}/diff:
    parameters:
      - $ref: "#/components/parameters/monorepo"
      - $ref: "#/components/parameters/repo"
      - $ref: "#/components/parameters/branch"
    get:
      operationId: branchDiff
      summary: The branch diff (GitHub's three-dot diff, merge base to head)
      description: |
        Computed in the Worker from Artifacts reads, with no clone: the merge
        base, a walk of the two trees that skips equal subtrees, the changed
        blobs only, and a Myers line diff. Exact renames (the same blob moved)
        show as `renamed`; there is no similarity rename detection.

        `max_bytes` bounds the bytes of hunk lines returned. Files past the
        budget keep their entry with `patch_omitted: budget`. A text file over
        1 MiB on either side, or one whose diff is too big to compute, has
        `patch_omitted: too_large` and null counts.
      tags: [branches]
      parameters:
        - name: format
          in: query
          schema:
            type: string
            enum: [json, patch]
            default: json
        - name: hunks
          in: query
          description: "`1` to include per-file hunks in JSON."
          schema: { type: string, enum: ["0", "1"], default: "0" }
        - name: max_bytes
          in: query
          description: Budget for hunk bytes. Default 1048576, maximum 8388608.
          schema: { type: integer, minimum: 0 }
        - name: paths
          in: query
          description: Path prefixes, comma-separated or repeated (`paths=src/auth/&paths=README.md`).
          schema: { type: string }
      responses:
        "200":
          description: |
            JSON, or `text/x-patch` for `format=patch`: a unified diff with
            `diff --git` headers, ready for `git apply` or
            `plannotator review --patch-file -`. In patch form, files past the
            budget are left out and the response carries
            `X-Pando-Diff-Omitted: <count>`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Diff" }
            text/x-patch:
              schema: { type: string }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: "`no_merge_base`: the branch shares no history with the default branch."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/monorepos/{monorepo}/repos/{repo}/branches/{branch}/reviews:
    parameters:
      - $ref: "#/components/parameters/monorepo"
      - $ref: "#/components/parameters/repo"
      - $ref: "#/components/parameters/branch"
    post:
      operationId: createReview
      summary: Review a branch (a comment or an approval; not a gate)
      tags: [reviews]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [verdict]
              properties:
                verdict:
                  type: string
                  enum: [comment, request_changes, approve]
                body: { type: string }
                head:
                  type: string
                  description: The sha reviewed. Defaults to the branch head now.
                comments:
                  type: array
                  items: { $ref: "#/components/schemas/ReviewComment" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Review" }
    get:
      operationId: listReviews
      summary: The branch's reviews, oldest first
      tags: [reviews]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [reviews]
                properties:
                  reviews:
                    type: array
                    items: { $ref: "#/components/schemas/Review" }
  /v1/monorepos/{monorepo}/repos/{repo}/branches/{branch}/merge:
    parameters:
      - $ref: "#/components/parameters/monorepo"
      - $ref: "#/components/parameters/repo"
      - $ref: "#/components/parameters/branch"
    post:
      operationId: mergeBranch
      summary: Land the branch on the default branch with a merge commit (any member)
      description: |
        Any member may merge, agents included (like `gh pr merge`). Reviews
        are not a gate. Merges in one repo run one at a time. The merge commit
        is authored as the user. The gate: every required check (the repo's `required_checks`;
        with none set, every reported context) is `success` on the branch
        head. `force=1` merges past red or missing checks, and the merge is
        recorded as forced.
      tags: [merges]
      parameters:
        - name: force
          in: query
          schema: { type: string, enum: ["0", "1"], default: "0" }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  description: The merge commit message. Default "<title>\n\n<description>\n\nMerge branch '<branch>'", or "Merge branch '<branch>'" with no title.
                expected_head:
                  type: string
                  description: Refuse with 409 `head_moved` unless the branch head is this sha.
      responses:
        "200":
          description: Merged, or already in the default branch.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MergeResult" }
        "409":
          description: "`conflict` (with `paths`: files changed differently on both sides; merge the default branch into the branch, push, and merge again), `head_moved`, or `ref_moved` (retry)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "412":
          description: "`checks_not_green`, with `checks`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "501":
          description: "`merge_engine_unavailable`: the server-side merge engine is not wired in yet."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/monorepos/{monorepo}/repos/{repo}/files/{path}:
    parameters:
      - $ref: "#/components/parameters/monorepo"
      - $ref: "#/components/parameters/repo"
      - name: path
        in: path
        required: true
        description: Repository-relative path; slashes as they are.
        schema: { type: string }
    get:
      operationId: getFile
      summary: One file's bytes at a ref
      tags: [repos]
      parameters:
        - name: ref
          in: query
          description: A branch, tag or sha. Defaults to the default branch.
          schema: { type: string }
      responses:
        "200":
          description: The raw bytes, with a sniffed Content-Type.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/Error" }
  /v1/monorepos/{monorepo}/repos/{repo}/statuses/{sha}:
    parameters:
      - $ref: "#/components/parameters/monorepo"
      - $ref: "#/components/parameters/repo"
      - name: sha
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: createStatus
      summary: Report a commit status (GitHub's body)
      tags: [statuses]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [state]
              properties:
                state: { $ref: "#/components/schemas/StatusState" }
                context: { type: string, default: default }
                target_url: { type: string }
                description: { type: string }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Status" }
  /v1/monorepos/{monorepo}/repos/{repo}/commits/{ref}/status:
    parameters:
      - $ref: "#/components/parameters/monorepo"
      - $ref: "#/components/parameters/repo"
      - name: ref
        in: path
        required: true
        description: A sha or a branch name (`%2F` for slashes).
        schema: { type: string }
    get:
      operationId: combinedStatus
      summary: The combined status of a commit (latest per context)
      tags: [statuses]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Checks" }
  /v1/monorepos/{monorepo}/repos/{repo}/hooks:
    parameters:
      - $ref: "#/components/parameters/monorepo"
      - $ref: "#/components/parameters/repo"
    post:
      operationId: createHook
      summary: Register a hook (owners)
      description: |
        `web`: a signed JSON POST to `url` (see `webhooks` below).
        `buildkite`: Pando calls Buildkite's create-build API,
        `POST https://api.buildkite.com/v2/organizations/{organization}/pipelines/{pipeline}/builds`,
        with the Worker secret `BUILDKITE_API_TOKEN`, for `push` events (by
        default) on branches that are not deleted. The build gets `commit`,
        `branch`, `message`, and `env`: `PANDO_CLONE_URL`, `PANDO_READ_TOKEN`
        (30 minutes, read only, this repo), `PANDO_STATUS_URL`,
        `PANDO_MONOREPO`, `PANDO_REPO`, `PANDO_BRANCH`, `PANDO_HEAD`,
        `PANDO_DELIVERY`.
      tags: [hooks]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type:
                  type: string
                  enum: [web, buildkite]
                url:
                  type: string
                  description: Required for `web`.
                secret:
                  type: string
                  description: For `web`, the HMAC key. Write only.
                events:
                  type: array
                  items: { $ref: "#/components/schemas/HookEvent" }
                  description: Default `[push, branch.opened, merged]` for web, `[push]` for buildkite.
                buildkite:
                  type: object
                  required: [organization, pipeline]
                  properties:
                    organization: { type: string }
                    pipeline: { type: string }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Hook" }
    get:
      operationId: listHooks
      summary: List hooks
      tags: [hooks]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [hooks]
                properties:
                  hooks:
                    type: array
                    items: { $ref: "#/components/schemas/Hook" }
  /v1/monorepos/{monorepo}/repos/{repo}/hooks/{hook_id}:
    parameters:
      - $ref: "#/components/parameters/monorepo"
      - $ref: "#/components/parameters/repo"
      - name: hook_id
        in: path
        required: true
        schema: { type: string }
    delete:
      operationId: deleteHook
      summary: Remove a hook (owners)
      tags: [hooks]
      responses:
        "204": { description: Removed }
  /v1/monorepos/{monorepo}/repos/{repo}/hooks/{hook_id}/deliveries:
    parameters:
      - $ref: "#/components/parameters/monorepo"
      - $ref: "#/components/parameters/repo"
      - name: hook_id
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: listDeliveries
      summary: The hook's deliveries, newest first (last 100)
      tags: [hooks]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [deliveries]
                properties:
                  deliveries:
                    type: array
                    items: { $ref: "#/components/schemas/Delivery" }
  /v1/monorepos/{monorepo}/repos/{repo}/hooks/deliveries/{delivery_id}/redeliver:
    parameters:
      - $ref: "#/components/parameters/monorepo"
      - $ref: "#/components/parameters/repo"
      - name: delivery_id
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: redeliver
      summary: Send a delivery again, as a new delivery with a fresh read token (owners)
      tags: [hooks]
      responses:
        "202":
          description: Queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Delivery" }
  /v1/monorepos/{monorepo}/worktrees:
    parameters:
      - $ref: "#/components/parameters/monorepo"
    get:
      operationId: listWorktrees
      summary: Every worktree in the monorepo, across machines
      tags: [worktrees]
      parameters:
        - name: machine
          in: query
          schema: { type: string }
        - name: repo
          in: query
          description: A repo path.
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [worktrees]
                properties:
                  worktrees:
                    type: array
                    items: { $ref: "#/components/schemas/Worktree" }
  /v1/monorepos/{monorepo}/worktrees/{worktree_id}:
    parameters:
      - $ref: "#/components/parameters/monorepo"
      - name: worktree_id
        in: path
        required: true
        description: Made by the client (formats.md, `wt_` and 16 hex characters).
        schema: { type: string, pattern: "^[A-Za-z0-9_-]{1,64}$" }
    put:
      operationId: putWorktree
      summary: Report a worktree (creates it, or replaces the one with this id)
      description: Each call also refreshes `last_seen_at`.
      tags: [worktrees]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [repo, branch, path, machine, kind]
              properties:
                repo: { type: string, description: "The repo path (`projects/web`, or `.`)." }
                branch: { type: string }
                path: { type: string, description: "The worktree path from the root (formats.md, section 1)." }
                machine: { type: string }
                agent: { type: [string, "null"], description: "The agent working in it, if any (PANDO_AGENT)." }
                kind: { type: string, enum: [fuse, sparse, fskit] }
      responses:
        "200":
          description: The worktree as stored.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Worktree" }
        "403": { $ref: "#/components/responses/Error" }
    get:
      operationId: getWorktree
      summary: One worktree
      tags: [worktrees]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Worktree" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: removeWorktree
      summary: Remove a worktree from the registry
      tags: [worktrees]
      responses:
        "204": { description: Removed }
        "404": { $ref: "#/components/responses/Error" }
webhooks:
  hookDelivery:
    post:
      operationId: hookDelivery
      summary: What a `web` hook receives
      description: |
        Headers: `X-Pando-Event` (the event), `X-Pando-Delivery` (the
        delivery id), `X-Pando-Signature-256: sha256=<hex>` (HMAC-SHA256 of
        the raw body with the hook's secret; GitHub's scheme under another
        name). A delivery that does not get a 2xx within 10 seconds is retried
        after 10 s, 1 min, 5 min and 30 min, then marked failed.
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HookPayload" }
      responses:
        "200": { description: Any 2xx counts as delivered. }
components:
  securitySchemes:
    credential:
      type: http
      scheme: bearer
      description: "A user's credential (`pando_` and 40 hex characters). Git sends it as the Basic password."
    bootstrap:
      type: http
      scheme: bearer
      description: The Worker secret PANDO_BOOTSTRAP.
  parameters:
    monorepo:
      name: monorepo
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Name" }
    repo:
      name: repo
      in: path
      required: true
      description: The repo's `name` (`projects-web`).
      schema: { type: string }
    branch:
      name: branch
      in: path
      required: true
      description: The branch name, `/` encoded as `%2F`.
      schema: { type: string }
  responses:
    Error:
      description: An error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Name:
      type: string
      pattern: "^[a-z0-9](?:[a-z0-9._]|-(?!-)){0,38}$"
      description: "A monorepo name: lower-case letters, digits, `.`, `_`, `-`; starts with a letter or digit; no `--`; at most 39 characters. `v1` and `healthz` are reserved."
    Login:
      type: string
      pattern: "^[a-z0-9](?:[a-z0-9]|-(?!-)){0,38}$"
      description: A user's login, GitHub's rules in lower case.
    MemberRole:
      type: string
      enum: [owner, member]
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            paths:
              type: array
              items: { type: string }
            checks: { $ref: "#/components/schemas/Checks" }
    Monorepo:
      type: object
      required: [name, kind, created_at]
      properties:
        name: { type: string }
        kind: { type: string, enum: [monorepo, repo] }
        role: { $ref: "#/components/schemas/MemberRole" }
        created_at: { type: string, format: date-time }
    User:
      type: object
      required: [login, created_at]
      properties:
        login: { type: string }
        name: { type: [string, "null"] }
        email: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
    Credential:
      type: object
      required: [id, name, kind, created_at]
      properties:
        id: { type: string }
        name: { type: string }
        kind: { type: string, enum: [machine, sandbox, bootstrap] }
        created_at: { type: string, format: date-time }
        last_used_at: { type: [string, "null"], format: date-time }
    NewCredential:
      allOf:
        - $ref: "#/components/schemas/Credential"
        - type: object
          required: [secret]
          properties:
            secret:
              type: string
              description: "`pando_` and 40 hex characters. Shown once; Pando keeps only its SHA-256."
    Invite:
      type: object
      required: [email, role, invited_by, created_at]
      properties:
        email: { type: string }
        role: { $ref: "#/components/schemas/MemberRole" }
        invited_by: { type: string }
        created_at: { type: string, format: date-time }
    Member:
      type: object
      required: [login, role, added_at]
      properties:
        login: { type: string }
        role: { $ref: "#/components/schemas/MemberRole" }
        added_at: { type: string, format: date-time }
        added_by: { type: [string, "null"] }
    Repo:
      type: object
      required: [monorepo, name, path, default_branch, clone_url, created_at]
      properties:
        monorepo: { type: string }
        name: { type: string, description: The repo's id in URLs (its path with `/` turned into `-`). }
        path: { type: string, description: "`projects/web`, or `.` for a plain repo." }
        description: { type: [string, "null"] }
        default_branch: { type: string, description: Always `main` for now. }
        clone_url:
          type: string
          description: The git door URL, `https://<host>/<monorepo>/<name>.git`.
        required_checks:
          type: array
          description: Read from `.pando/pando.toml` on main when the repo is fetched one at a time (getRepo); left out of lists.
          items: { type: string }
        created_at: { type: string, format: date-time }
        created_by: { type: string }
    Branch:
      type: object
      required: [name, head, state, checks]
      properties:
        name: { type: string }
        head: { type: string }
        base:
          type: [string, "null"]
          description: The merge base with the default branch; null when there is none.
        author:
          type: [string, "null"]
          description: The user whose first push (or createBranch) made the branch.
        title: { type: [string, "null"] }
        description: { type: [string, "null"] }
        ahead:
          type: [integer, "null"]
          description: Commits on the branch that are not on the default branch.
        behind:
          type: [integer, "null"]
          description: Commits on the default branch that are not on the branch.
        mergeable:
          type: string
          enum: [clean, conflicts, up_to_date, unknown]
          description: From the merge engine's dry run. `up_to_date` means the branch adds nothing.
        checks: { $ref: "#/components/schemas/Checks" }
        state:
          type: string
          enum: [open, merged]
          description: "`merged` when the branch's current head was landed by a Pando merge."
        merge_commit: { type: [string, "null"] }
        created_at: { type: [string, "null"], format: date-time }
        updated_at: { type: [string, "null"], format: date-time }
    StatusState:
      type: string
      enum: [pending, success, failure, error]
    Status:
      type: object
      required: [sha, context, state, created_at]
      properties:
        sha: { type: string }
        context: { type: string }
        state: { $ref: "#/components/schemas/StatusState" }
        target_url: { type: [string, "null"] }
        description: { type: [string, "null"] }
        creator: { type: string }
        created_at: { type: string, format: date-time }
    Checks:
      type: object
      required: [sha, state, required, statuses]
      description: GitHub's combined status, plus the required contexts and which are missing.
      properties:
        sha: { type: [string, "null"] }
        state:
          type: string
          enum: [success, pending, failure, error, missing]
          description: "`success` when the merge gate passes; `missing` when a required context has not reported."
        required:
          type: array
          items: { type: string }
        missing:
          type: array
          items: { type: string }
        statuses:
          type: array
          description: The latest status per context.
          items: { $ref: "#/components/schemas/Status" }
    Diff:
      type: object
      required: [base_branch, base, head, merge_base, files, truncated]
      properties:
        base_branch: { type: string, description: The default branch. }
        base: { type: string, description: The default branch's head. }
        head: { type: string, description: The branch head. }
        merge_base: { type: string, description: Where the diff starts (three-dot). }
        truncated:
          type: boolean
          description: "True when any file has `patch_omitted: budget`."
        stats:
          type: object
          properties:
            files: { type: integer }
            additions: { type: integer }
            deletions: { type: integer }
        files:
          type: array
          items: { $ref: "#/components/schemas/DiffFile" }
    DiffFile:
      type: object
      required: [path, status, binary]
      properties:
        path: { type: string }
        old_path: { type: string, description: Only for `renamed`. }
        status:
          type: string
          enum: [added, modified, deleted, renamed]
        old_sha: { type: [string, "null"] }
        new_sha: { type: [string, "null"] }
        old_mode: { type: [string, "null"] }
        new_mode: { type: [string, "null"] }
        binary: { type: boolean }
        additions: { type: [integer, "null"] }
        deletions: { type: [integer, "null"] }
        hunks:
          type: array
          description: Only with `hunks=1`.
          items: { $ref: "#/components/schemas/Hunk" }
        patch_omitted:
          type: string
          enum: [binary, too_large, budget]
    Hunk:
      type: object
      required: [old_start, old_lines, new_start, new_lines, lines]
      properties:
        old_start: { type: integer }
        old_lines: { type: integer }
        new_start: { type: integer }
        new_lines: { type: integer }
        lines:
          type: array
          description: Each line starts with `+`, `-`, ` `, or `\` (no newline at end of file).
          items: { type: string }
    ReviewComment:
      type: object
      required: [path, body]
      properties:
        path: { type: string }
        line: { type: integer, description: A line in the new file. }
        side: { type: string, enum: [new, old], default: new }
        body: { type: string }
    Review:
      type: object
      required: [id, branch, head, verdict, author, created_at]
      properties:
        id: { type: string }
        branch: { type: string }
        head: { type: string }
        verdict: { type: string, enum: [comment, request_changes, approve] }
        body: { type: [string, "null"] }
        comments:
          type: array
          items: { $ref: "#/components/schemas/ReviewComment" }
        author: { type: string }
        created_at: { type: string, format: date-time }
    MergeResult:
      type: object
      required: [status, branch, head]
      properties:
        status:
          type: string
          enum: [merged, up_to_date]
        branch: { type: string }
        head: { type: string, description: The branch head that was merged. }
        sha: { type: string, description: The merge commit (or the default branch head for `up_to_date`). }
        base_before: { type: string, description: The default branch head before the merge. }
        merge_base: { type: string }
        forced: { type: boolean }
        merged_by: { type: string }
    HookEvent:
      type: string
      enum: [push, branch.opened, merged]
      description: "`branch.opened`: the first push of a branch. `push`: any push through the door that moves or deletes a branch. `merged`: a Pando merge landed a branch."
    Hook:
      type: object
      required: [id, type, events, active, created_at]
      properties:
        id: { type: string }
        type: { type: string, enum: [web, buildkite] }
        url: { type: [string, "null"] }
        events:
          type: array
          items: { $ref: "#/components/schemas/HookEvent" }
        buildkite:
          type: [object, "null"]
          properties:
            organization: { type: string }
            pipeline: { type: string }
        active: { type: boolean }
        created_at: { type: string, format: date-time }
        created_by: { type: string }
    Delivery:
      type: object
      required: [id, hook_id, event, status, attempts, created_at]
      properties:
        id: { type: string }
        hook_id: { type: string }
        event: { $ref: "#/components/schemas/HookEvent" }
        status: { type: string, enum: [pending, delivered, failed] }
        attempts: { type: integer }
        response_code: { type: [integer, "null"] }
        error: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        last_attempt_at: { type: [string, "null"], format: date-time }
        next_attempt_at: { type: [string, "null"], format: date-time }
    Worktree:
      type: object
      required: [id, repo, branch, path, machine, kind, reported_by, created_at, last_seen_at]
      properties:
        id: { type: string }
        repo: { type: string }
        branch: { type: string }
        path: { type: string }
        machine: { type: string }
        agent: { type: [string, "null"] }
        kind: { type: string, enum: [fuse, sparse, fskit] }
        reported_by: { type: string, description: The user whose credential reported it. }
        created_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
    HookPayload:
      type: object
      required: [event, delivery_id, occurred_at, monorepo, repo, ref, clone_url]
      properties:
        event: { $ref: "#/components/schemas/HookEvent" }
        delivery_id: { type: string }
        occurred_at: { type: string, format: date-time }
        monorepo: { type: string }
        repo: { type: string }
        branch: { type: string }
        ref: { type: string, description: "`refs/heads/<branch>`" }
        head: { type: string, description: The new head; all zeros when the branch was deleted. }
        before: { type: string, description: The old head; all zeros for a new branch. }
        base: { type: [string, "null"], description: The merge base with the default branch. }
        title: { type: [string, "null"] }
        description: { type: [string, "null"] }
        author: { type: [string, "null"], description: The branch's author (a user). }
        pusher: { type: string, description: "The user who pushed; for `merged`, who merged." }
        merge_commit: { type: string, description: Only for `merged`. }
        diff_url: { type: string }
        clone_url: { type: string, description: The git door URL. Clone it with `read_token`. }
        read_token:
          type: string
          description: "A read-only token for this one repo, valid 30 minutes, minted for this delivery. Use it as `Authorization: Bearer <read_token>` against `clone_url`."
        read_token_expires_at: { type: string, format: date-time }
