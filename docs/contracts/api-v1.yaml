openapi: 3.1.0
info:
  title: Pando API
  version: "1"
  summary: The /v1 API of the Pando Worker.
  description: |
    Owner: the server-git lane. Others ask pando-ops for changes.

    Shape:
    - A monorepo is `owner/name`, like GitHub (NAMESPACES.md): the owner is
      a namespace (a person's login; organizations later), the name is
      unique within its owner, and a permanent `id` keys everything stored.
      A rename or a transfer changes the label only; the old `owner/name`
      keeps working (an alias) until its owner gives that name to another
      monorepo, which the create or rename answer reports
      (`replaced_alias`). Owners and names match without case and are
      stored lower case.
    - In payloads, `monorepo` is always the `owner/name` label and
      `monorepo_id` always the id (repos, hook payloads, feed lines,
      needs-you rows, socket frames). The Monorepo object itself has `id`,
      `owner`, `name` and `full_name`.
    - Every route is under `/v1/monorepos/{owner}/{monorepo}`, except the
      user's own (`/v1/user`, `/v1/monorepos`) and the web home's, which
      span all of the person's monorepos (`/v1/events`, `/v1/branches`). A
      monorepo holds repos. A plain git repo is a monorepo of kind `repo`
      holding exactly one repo, at path `.`, and no meta layer; it uses the
      same routes. The meta layer's routes
      (`/v1/monorepos/{owner}/{monorepo}/meta/...`) are in `meta-sync.md`.
    - A repo has a `path` (as in `formats.md`: `projects/web`, or `.` in a
      plain repo) and a `name`, its id in URLs: the path with each `/`
      turned into `-` (`projects-web`). A plain repo's name is the
      monorepo's name when it was made (a rename does not change it).
      Names are unique in a monorepo.
    - In a monorepo, the repo named `meta` (path `.`, clone_url
      `<host>/<owner>/<monorepo>/meta.git`) is the meta layer's own git history. It
      takes branches, diffs, reviews and merges like any repo, and it is how
      `.pando/**` changes: after a merge into it, the merged files go to the
      live meta layer on every machine. It is not in listRepos.
    - Git goes through the git door at the repo's `clone_url`:
      `https://<host>/<owner>/<monorepo>/<name>.git` for a monorepo's repos,
      `https://<host>/<owner>/<name>.git` for a plain repo (smart HTTP; see
      the `git` tag). Pushes to the default branch are refused, except the first push
      that creates it. Every other push goes through.
    - Every other call is JSON with `Authorization: Bearer <credential>`.

    Artifacts repos, in the namespace `pando-dev`, are named from the
    monorepo's id and kept on each repo's record (Artifacts has no rename):
    a project repo is `<id>--<name>` (`m_0123456789abcdef--projects-web`), a
    plain repo `<id>--<name>`, and the meta layer `<id>--meta`. New ids are
    `m_` and 16 hex characters; a monorepo made before namespaces kept its
    old name as its id. Ids and names have no `--`, so the split is never
    ambiguous. These names are internal: clients use `clone_url`.

    Required checks: the server reads `required_checks` from
    `.pando/pando.toml` on main (`formats.md`, section 2). In a monorepo
    that is the meta layer's main, table `[repos."<repo path>"]`; in a plain
    repo, the repo's own main, table `[repos."."]`.

    Identity works like GitHub's. A person has a user account and belongs to
    monorepos as `owner` or `member`. A machine signs in once
    (`pando login`) and holds a credential for that user; git and every agent
    on the machine act as that user, the way `gh` and git credentials do. A
    cloud sandbox gets a credential its user makes for it. Credentials are
    listed and revocable. Commits are authored as the user; Pando's commit
    trailers name the agent.

    Any member may push, review, post statuses, report worktrees and merge
    (agents included, through the user's credential). Reviews are comments
    and approvals, not a gate. The merge gate is the checks, and `?force=1`
    merges past them. Owners also manage members and hooks.

    Signing in (`pando login`): WorkOS AuthKit's CLI Auth, the OAuth device
    flow, run through the Worker. `POST /v1/login/device` returns a code
    and a URL; the person confirms the code in the browser; the CLI polls
    `POST /v1/login/token` with the device code until it returns the user and
    a new machine credential. WorkOS only proves who the person is: Pando
    keeps its own users, credentials and membership, and keeps no WorkOS
    token. A user's login comes from their email (`ana@x.com` is `ana`, or
    `ana-2` if taken). Invites by email wait until that email first signs in.

    In a browser: `GET /v1/login/browser?return_to=<path>` sends the person to
    AuthKit's page; WorkOS sends them back to `/v1/login/callback`, which sets
    the session cookie `__Host-pando_session` (HttpOnly, Secure,
    SameSite=Lax, host-only) and returns them to `return_to` (a path on this
    host, else `/`). The session is a credential of kind `browser` for the
    same Pando user, so it sees the same monorepos. It works on `/v1` only:
    never as a Bearer token and never at the git door. With the cookie, a
    write (any method but GET and HEAD) or a WebSocket upgrade must carry
    `Origin` equal to Pando's own origin, else 403 `bad_origin`. A session
    ends after 30 days without use, on sign-out (`POST /v1/logout`, which also
    ends the WorkOS session), or when revoked.

    Self-hosted, one person: the Worker secret `PANDO_BOOTSTRAP` makes users
    with `POST /v1/users` (it works there only). Either way, a user then makes
    more credentials (`POST /v1/user/credentials`) and monorepos
    (`POST /v1/monorepos`).

    Agents: an agent acts as its user, through the user's credential. It may
    also send `X-Pando-Agent: <name>` on API calls and pushes; Pando then
    records the agent on merges (`merged_agent`) and on events.

    Branch names in paths: encode `/` as `%2F` (`agent-3%2Foauth`). Raw
    slashes are accepted too.

    Errors are JSON: `{"error": {"code": "...", "message": "..."}}`.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: https://pando-dev.{subdomain}.workers.dev
    variables:
      subdomain:
        default: example
security:
  - credential: []
  - session: []
tags:
  - name: git
    description: |
      The git door. Plain git clients use it; no Pando client is needed.

      ```
      GET  /{owner}/{monorepo}/{repo}.git/info/refs?service=git-upload-pack
      GET  /{owner}/{monorepo}/{repo}.git/info/refs?service=git-receive-pack
      POST /{owner}/{monorepo}/{repo}.git/git-upload-pack
      POST /{owner}/{monorepo}/{repo}.git/git-receive-pack
      ```

      A plain repo drops the repo segment: `/{owner}/{name}.git/...`. The
      other shape answers 404 saying which one fits. An old `owner/name`
      (after a rename or a transfer) still works.

      Credentials: HTTP Basic with the user's credential as the password
      (any username; this is what `pando credential`, the git credential
      helper, supplies), or `Authorization: Bearer <credential>`. Without
      credentials the door answers 401 with `WWW-Authenticate: Basic`, so a
      credential helper is asked.

      Protocol v2 `object-info` (sizes without downloading): Artifacts does
      not offer it, so the door adds `object-info` to the v2 advertisement and
      answers `command=object-info` itself, in git's own reply format
      (`size`, then `<oid> <size>` per object; an unknown object gets
      `<oid> ` with no size). Sizes come from a per-repo index, filled on
      first ask and kept forever. Every other v2 command goes to Artifacts
      unchanged.

      Clone and fetch also accept the read token from a hook delivery
      (`read_token` for a web hook, 30 minutes; `PANDO_READ_TOKEN` for a
      Buildkite build, at least 24 hours so Buildkite's Retry can still
      clone), so CI clones from `clone_url` with no credential of its own.

      Only members of the monorepo get through.

      Writes per repo: an Artifacts repo takes about two writes at once, so
      every write (a push, a branch create or delete, a merge, a meta layer
      commit) waits for one of the repo's two write slots, first come first
      served. git just waits. A push that waits 120 s gets
      `remote error: Pando: <repo> is busy with other writes; try the push again`.
      The ceiling is about 5 to 10 small pushes a second per repo.

      Push rule (receive-pack). The door reads the command list before the
      pack. If any command updates or deletes the repo's default branch
      (`refs/heads/main`), it refuses the whole push with git's usual
      `! [remote rejected] main (main is protected; ...)` line. Creating main
      when it does not exist yet is allowed: that is the first push of
      `pando init`. Main moves only by a merge.

      Busy repos. Artifacts runs about 2 receive-packs at once per repo and
      answers others "busy". The door holds a push of up to 1 MiB in memory
      and sends it again once, after 150 to 400 ms. A push that is still
      refused, or is larger, is rejected with
      `Pando: <repo> is busy with other pushes right now; push again` (every
      ref `busy; push again`), and nothing is written: push again. A call to
      Artifacts that fails outright is handled the same way: retried once
      for a held push, else `Pando: <repo> couldn't take this push right
      now; push again`, never a bare HTTP 500.

      Raw files (FILES.md section 3), GET or HEAD, beside the git door:
      `/{owner}/{monorepo}/projects/{repo}/raw/{path}?ref=` for a
      monorepo's project repo, `/{owner}/{name}/raw/{path}?ref=` for a plain
      repo. The session cookie or a Bearer credential. Served so nothing
      runs: `Content-Security-Policy: sandbox`, nosniff, images as images,
      everything else as `text/plain` (HTML and SVG included) or, with a NUL
      in its first 8,000 bytes, `application/octet-stream`. `ETag` is the
      blob's hash. By branch: `private, no-cache` (a repeat is a 304); by a
      40-character sha: `private, max-age=31536000, immutable`.

      The door records each pushed branch's head and, on its first push, its
      author (the user). Then it delivers the `branch.opened` and `push`
      hooks.
  - name: ci
    description: |
      CI on one model for every service (RESEARCH-2026-10-03 section 6):
      a **service** (`buildkite` today), a **connection** (one account of it:
      a Buildkite organization), its **pipelines** (each builds one repo),
      **builds**, **jobs**, and each job's **check**. Pando runs no CI.

      - **Stored by Pando, pushed by the service.** A connection gets a
        webhook URL; the service's webhooks keep builds and jobs (state,
        times, links) in the monorepo's records, written in one step with
        their events on the monorepo's stream (`ci.build`, `ci.job`) before
        the webhook is answered. Viewers cost the service nothing.
      - **A check is a job named by its step key**: a job keyed `ci` writes
        the status `ci` (`app` `buildkite`, `creator` `app:buildkite`), so
        `required_checks = ["ci"]` in `.pando/pando.toml` gates merges on it.
        Commands and triggered builds report; waits and blocks do not. Only
        the newest job with that key, in the newest build of that pipeline
        for that commit, reports (a retry or a rebuild takes over). States:
        passed is success; failed is failure (soft failed: success);
        canceled, not run after a failure (`broken`) or not taken by an
        agent (`expired`) are error; a skipped step is success.
      - **Fetched from the service when opened**: a job's log (its last
        1 MiB), a build's annotations and artifacts (first 100 of each), a
        pipeline's configuration (read at most every 5 minutes). Cached once
        settled (finished over 30 s ago), else for 10 s.
      - **Actions**, any member: Rebuild (a new build of the same commit
        with fresh tokens; the service's own rebuild would reuse the old
        build's env), Cancel and Retry (passed through).
      - **Mapping a build to a repo**: Pando's own builds carry
        `meta_data.pando_delivery`, `pando_monorepo` and `pando_repo`; a
        build started in the service maps through the buildkite hook that
        names its pipeline. Other builds (another monorepo's, another
        organization's, an unmapped pipeline's) are answered 200 and ignored.
      - **Who pushed** comes from Pando's own records: the delivery that
        started the build, else the push or merge that made the commit.
      - **The service's rate limit**: Buildkite allows 200 REST calls a
        minute per organization and 50 per user token. A connection makes at
        most 40 a minute (10 are left for starting builds); past that, or
        after Buildkite answers 429, calls answer 503 `ci_rate_limited` with
        `retry_after_ms`.

      Errors from the service: `ci_unauthorized` (502: the token lacks a
      scope), `ci_refused` (409: Buildkite refused the action),
      `ci_service` (502), `ci_rate_limited` (503), `ci_token_missing` (503:
      the Worker secret BUILDKITE_API_TOKEN is not set).
paths:
  /v1/users:
    post:
      operationId: createUser
      summary: Make a user and a first credential (bootstrap secret only; self-hosted, one person)
      tags: [users]
      security:
        - bootstrap: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [login]
              properties:
                login: { $ref: "#/components/schemas/Login", description: "Lowered first. 400 `reserved_name` for a reserved one; 409 `namespace_taken` when a person or an organization has it." }
                name: { type: string, description: A display name. }
                email: { type: string, description: Used on merge commits. }
                credential_name: { type: string, description: "A name for the first credential, for example the machine name. Default `bootstrap`." }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [user, credential]
                properties:
                  user: { $ref: "#/components/schemas/User" }
                  credential: { $ref: "#/components/schemas/NewCredential" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503":
          description: "`bootstrap_not_configured`: the PANDO_BOOTSTRAP secret is not set."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/login/device:
    post:
      operationId: loginStart
      summary: "pando login, step 1: a code to confirm in the browser"
      description: |
        Starts WorkOS CLI Auth. Show `user_code` and `verification_uri` (or
        open `verification_uri_complete`). Keep `device_code` to yourself: it
        is what the CLI polls with. No credential needed.
      tags: [users]
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [device_code, user_code, verification_uri, expires_in, interval]
                properties:
                  device_code: { type: string }
                  user_code: { type: string, description: "For example `RRGQ-BJVS`." }
                  verification_uri: { type: string }
                  verification_uri_complete: { type: string }
                  expires_in: { type: integer, description: "Seconds, usually 300." }
                  interval: { type: integer, description: "Seconds between polls, usually 5." }
        "503":
          description: "`sign_in_not_configured`: WORKOS_CLIENT_ID is not set on this Worker (use the bootstrap path)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/login/token:
    post:
      operationId: loginPoll
      summary: "pando login, step 2 (polled): the user and a new machine credential"
      description: |
        Poll every `interval` seconds. Until the person confirms, the answer is
        400 with `error.code` `authorization_pending` (keep polling) or
        `slow_down` (add 5 seconds to the interval). `access_denied`,
        `expired_token` and `invalid_grant` end the attempt. On success,
        `joined` lists the monorepos (`owner/name`) whose email invites were accepted, and
        the CLI stores `credential.secret` where formats.md says
        (`~/.pando/credentials/<host>`, mode 600).
      tags: [users]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device_code, credential_name]
              properties:
                device_code: { type: string }
                credential_name: { type: string, description: "The machine name (formats.md, section 7)." }
                kind: { type: string, enum: [machine, sandbox], default: machine }
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                type: object
                required: [user, credential, joined]
                properties:
                  user: { $ref: "#/components/schemas/User" }
                  credential: { $ref: "#/components/schemas/NewCredential" }
                  joined:
                    type: array
                    items: { type: string }
        "400":
          description: "Not yet, or not at all: `error.code` is one of the codes above."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/login/browser:
    get:
      operationId: loginBrowser
      summary: Sign in a browser (redirects to AuthKit)
      tags: [users]
      security: []
      parameters:
        - name: return_to
          in: query
          description: A path on this host to come back to. Anything else becomes `/`.
          schema: { type: string, default: / }
      responses:
        "302": { description: "To AuthKit's sign-in page, with a 10-minute `__Host-pando_login` cookie holding state and the PKCE verifier." }
  /v1/login/callback:
    get:
      operationId: loginCallback
      summary: Where AuthKit sends the browser back (sets the session cookie)
      tags: [users]
      security: []
      responses:
        "302": { description: "To `return_to`, with `__Host-pando_session` set." }
        "400":
          description: "`bad_state` (no matching sign-in, or older than 10 minutes) or `sign_in_failed`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/logout:
    get:
      operationId: logoutPage
      summary: A one-button page that posts to /v1/logout
      tags: [users]
      security: []
      responses:
        "200": { description: HTML }
    post:
      operationId: logout
      summary: Sign out this browser (and end its WorkOS session)
      description: Revokes the session in the cookie, clears the cookie, and sends the browser to WorkOS's logout URL, which returns to `/`. Needs `Origin` equal to Pando's own.
      tags: [users]
      security:
        - session: []
      responses:
        "200":
          description: "With `Accept: application/json`."
          content:
            application/json:
              schema:
                type: object
                properties:
                  signed_out: { type: boolean }
                  logout_url: { type: string, description: Open this to end the WorkOS session too. }
        "303": { description: To WorkOS's logout URL (a form post). }
        "403": { $ref: "#/components/responses/Error" }
  /v1/user:
    get:
      operationId: me
      summary: The user behind the credential, and the credential itself
      tags: [users]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/User"
                  - type: object
                    required: [credential]
                    properties:
                      credential: { $ref: "#/components/schemas/Credential" }
        "401": { $ref: "#/components/responses/Error" }
  /v1/user/credentials:
    post:
      operationId: createCredential
      summary: Make a credential for this user (another machine, a cloud sandbox)
      description: The new credential acts as the same user. Its secret is shown once.
      tags: [users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, description: "The machine or sandbox, for example `ramos-mbp` or `sandbox-agent-3`." }
                kind: { type: string, enum: [machine, sandbox], default: machine }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NewCredential" }
    get:
      operationId: listCredentials
      summary: This user's credentials (no secrets)
      tags: [users]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [credentials]
                properties:
                  credentials:
                    type: array
                    items: { $ref: "#/components/schemas/Credential" }
  /v1/user/credentials/{credential_id}:
    parameters:
      - name: credential_id
        in: path
        required: true
        schema: { type: string }
    delete:
      operationId: revokeCredential
      summary: Revoke one of this user's credentials
      tags: [users]
      responses:
        "204": { description: Revoked }
        "404": { $ref: "#/components/responses/Error" }
  /v1/monorepos:
    post:
      operationId: createMonorepo
      summary: Create a monorepo; the caller becomes its owner
      tags: [monorepos]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { $ref: "#/components/schemas/Name" }
                owner: { $ref: "#/components/schemas/Login", description: "The namespace; default and, for now, only your own (403 `not_your_namespace`; organizations later)." }
                kind:
                  type: string
                  enum: [monorepo, repo]
                  default: monorepo
                  description: |
                    `monorepo`: Pando also makes the meta layer's Artifacts repo
                    (`<id>--meta`, empty); add code repos with createRepo.
                    `repo`: a plain git repo; Pando makes its one repo (path `.`,
                    name = the monorepo's name) and returns it in `repos`.
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [monorepo, repos, replaced_alias]
                properties:
                  monorepo: { $ref: "#/components/schemas/Monorepo" }
                  repos:
                    type: array
                    description: The plain repo for kind `repo`; empty for kind `monorepo`.
                    items: { $ref: "#/components/schemas/Repo" }
                  replaced_alias: { $ref: "#/components/schemas/ReplacedAlias" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { description: "`monorepo_exists`: the owner has a monorepo with that name.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    get:
      operationId: listMonorepos
      summary: The monorepos this user belongs to
      description: |
        By owner, then name. With `?name=<name>`: only those named so, under
        any owner (`pando clone <name>`: the cli prefers your own namespace,
        else the only match, else it asks). With `?summary=1` (the web home): most recently active first,
        each with its one line (`MonorepoSummary`), answered from the person's
        feed in one call (no call per monorepo). The line is up to 10 s behind
        (60 s for a monorepo of more than 100 members): each monorepo sends it
        only when it changed, at most that often. A monorepo the feed has not
        joined yet (seconds after it was made or joined) has nulls.
      tags: [monorepos]
      parameters:
        - name: summary
          in: query
          schema: { type: string, enum: ["1"] }
        - name: name
          in: query
          description: A monorepo name (any case). No match is an empty list.
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [monorepos]
                properties:
                  monorepos:
                    type: array
                    items:
                      oneOf:
                        - $ref: "#/components/schemas/Monorepo"
                        - $ref: "#/components/schemas/MonorepoSummary"
  /v1/events:
    get:
      operationId: listActivity
      summary: The activity log across the person's monorepos (JSON pages, or the person's WebSocket)
      description: |
        The web home's log: what happened in every monorepo the person belongs
        to, newest first, each line with its `monorepo`. People, machines and
        worktrees only: no agent field (owner ruling).

        Lines are the activity kinds: `push`, `branch.opened`,
        `branch.deleted`, `merged`, `review`, `status` (only when a check's
        state changes), `worktree.reported` (a new worktree only),
        `worktree.removed`, `meta.saved` (not files a merge brought in). The
        cache-sync kinds stay on the per-monorepo stream.

        Order and cursor: every line has the display key `(at, monorepo, seq)`.
        `next` is an opaque cursor, "older than this line"; pass it back as
        `cursor`. It is stable while lines arrive: new lines are newer, and a
        late or repeated delivery never moves a line already paged past.

        Where lines come from: each person has a feed (a Durable Object). A
        monorepo of 100 members or fewer copies its lines into its members'
        feeds; a larger one is read from its own log on every page. A feed
        keeps 7 days (at most 1,000,000 lines); older pages, and a monorepo
        the feed joined with a partial history, are read from the monorepos'
        own logs, which keep everything. At most 20 logs are read for one
        page, most recently active first; the rest are named in `skipped`
        (narrow with `in` to read one of them).

        With `Upgrade: websocket`: one socket per person, for every small
        monorepo. Send `{"type": "hello", "since": <landed>}` (since
        optional): the feed replays the lines that landed after it (at most
        500, else one `resync` frame: refetch the first page), then
        `{"type": "caught_up", "landed"}`. `landed` is the feed's own arrival
        number, not a time: keep the highest seen and send it on reconnect.
        Live frames:
        - `{"type": "event", "landed", "event": FeedEvent}`: place it by its
          display key. The same line can arrive again with a fuller
          `summary` (a push's commit count); replace by `(monorepo_id, seq)`.
        - `{"type": "summary", "monorepo", "monorepo_id", "summary": FeedSummary}`.
        - `{"type": "needs", "monorepo", "monorepo_id", "changed": [{repo, branch, state}], "more"}`:
          branches that entered or left "needs you" (`state` null: left);
          `more`: over 50 changed, refetch listNeeds.
        - `{"type": "joined", "monorepo", "monorepo_id", "large"}`, `{"type": "left", "monorepo", "monorepo_id"}`:
          refetch the first page and the list.
        Every frame's `monorepo` is the `owner/name` label (as the index last
        heard it; a rename shows within a minute) and `monorepo_id` the id.
        The text `ping` gets `pong`. Lines of large monorepos do not come
        here: open their own event socket with `topics=feed` (the home opens
        at most 5; it refreshes the others every 60 s).

        Cookie or Bearer. With the cookie, the upgrade must carry Pando's own
        `Origin` (403 `bad_origin`).
      tags: [monorepos]
      parameters:
        - name: cursor
          in: query
          description: A `next` from an earlier page.
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: in
          in: query
          description: "One monorepo's `owner/name` (an old name works too). The home narrows by monorepo only."
          schema: { type: string }
      responses:
        "200":
          description: A page, newest first
          content:
            application/json:
              schema:
                type: object
                required: [events, next, from_logs, skipped]
                properties:
                  events:
                    type: array
                    items: { $ref: "#/components/schemas/FeedEvent" }
                  next: { type: [string, "null"], description: The cursor for the next (older) page; null at the end. }
                  from_logs: { type: boolean, description: "True when the page went past the feed's window and read monorepos' own logs." }
                  skipped:
                    type: array
                    description: Monorepos (`owner/name`) not read for this page (over 20 logs); narrow with `in` to read one.
                    items: { type: string }
        "101": { description: The person's WebSocket. }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/branches:
    get:
      operationId: listNeeds
      summary: '"Needs you": open branches that are ready, conflicting or failing, across the person''s monorepos'
      description: |
        From stored branch facts and statuses (no Artifacts call), asked only
        of the monorepos whose counts in their summary line are not zero (up
        to 10 s behind), most recently active first, at most 50 monorepos (the
        rest in `skipped`). One state per branch, in this order:
        - `conflicts`: the stored dry run for the branch's current head
          conflicts with main;
        - `failing`: a check on the head failed or errored;
        - `ready`: facts for the current main and head say clean, and the
          merge gate's checks pass.
        Facts are computed for branches pushed in the last 7 days; an older
        branch that is not re-pushed drops out of `ready` when main moves.
        Rows are newest push first.
      tags: [branches]
      parameters:
        - name: state
          in: query
          schema: { type: string, enum: [open], default: open }
        - name: needs
          in: query
          description: Comma-separated, some of ready, conflicts, failing (default all three).
          schema: { type: string, default: "ready,conflicts,failing" }
        - name: in
          in: query
          description: "One monorepo's `owner/name`."
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [branches, truncated, skipped]
                properties:
                  branches:
                    type: array
                    items: { $ref: "#/components/schemas/NeedRow" }
                  truncated: { type: boolean }
                  skipped:
                    type: array
                    description: Monorepos (`owner/name`) not asked (over 50).
                    items: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/monorepos/{owner}/{monorepo}:
    parameters:
      - $ref: "#/components/parameters/owner"
      - $ref: "#/components/parameters/monorepo"
    get:
      operationId: getMonorepo
      summary: Get a monorepo (members); an old name answers with the current one
      tags: [monorepos]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Monorepo" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      operationId: renameMonorepo
      summary: Rename or transfer a monorepo (owners)
      description: |
        The label moves; the id, repos, history, members, Artifacts repos and
        feeds stay. The old `owner/name` keeps working for the API and the git
        door (an alias) until that owner gives the name to another monorepo.
        A transfer goes, for now, to a person who is already an owner of it
        (400 `bad_owner`; organizations later). 409 `monorepo_exists` when the
        new name is taken. `replaced_alias` reports an old name of another
        monorepo that this one took over.
      tags: [monorepos]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { $ref: "#/components/schemas/Name" }
                owner: { $ref: "#/components/schemas/Login" }
      responses:
        "200":
          description: Renamed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Monorepo"
                  - type: object
                    required: [replaced_alias]
                    properties:
                      replaced_alias: { $ref: "#/components/schemas/ReplacedAlias" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteMonorepo
      summary: Delete a monorepo, its repos and their history (owners)
      description: Deletes every Artifacts repo it owns (`<id>--*`, the meta layer's too), the meta layer's large files in R2 (`meta/<id>/`), its records, invites, memberships and old names. No soft delete. Needs `?confirm=<owner>/<name>`, typed out in full.
      tags: [monorepos]
      parameters:
        - name: confirm
          in: query
          required: true
          schema: { type: string }
      responses:
        "204": { description: Deleted }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /v1/monorepos/{owner}/{monorepo}/heads:
    parameters:
      - $ref: "#/components/parameters/owner"
      - $ref: "#/components/parameters/monorepo"
    get:
      operationId: heads
      summary: Every code repo's main head (for followers; no Artifacts read)
      description: |
        Main as Pando last moved it: by the first push through the door, or by
        a merge. Answered from the monorepo object's records. A repo made
        before Pando kept heads is read once from Artifacts and kept. `head` is
        null for an empty repo. The meta layer's repo is not listed.

        A follower (`pando worktree follow`) calls this on connect, then opens
        `GET /v1/monorepos/{owner}/{monorepo}/events?topics=main&since=<seq>` (WebSocket) to
        hear each move, and calls it again every few minutes as a safety net.
      tags: [repos]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [heads, seq]
                properties:
                  heads:
                    type: array
                    items:
                      type: object
                      required: [repo, path, default_branch, head, updated_at]
                      properties:
                        repo: { type: string, description: The repo's name in URLs. }
                        path: { type: string }
                        default_branch: { type: string }
                        head: { type: [string, "null"] }
                        updated_at: { type: [string, "null"], format: date-time }
                  seq:
                    type: [integer, "null"]
                    description: The event stream's newest seq when this was read; resume the socket from it. Null when the stream is off.
  /v1/monorepos/{owner}/{monorepo}/events:
    parameters:
      - $ref: "#/components/parameters/owner"
      - $ref: "#/components/parameters/monorepo"
    get:
      operationId: events
      summary: The monorepo's event stream (JSON pages, or a WebSocket)
      description: |
        Every change a screen shows is an event, written in the same step as
        the change itself: a `seq`, a `kind`, and the changed `row` in its REST
        shape, with the client-side `collection`, `key` and `op` (`upsert` or
        `delete`) it applies to, so a client store (TanStack DB) can apply it
        directly. Every event is kept; the one limit is the monorepo object's
        storage (10 GB per Durable Object; an event is 0.3 to 1.3 KB).

        Kinds, by collection:
        - branches: `branch.opened`, `push`, `branch.updated`, `merged`
          (upsert), `branch.deleted` (delete). The row has the branch's stored
          fields only (name, head, author, title, description, state and the
          merge facts) and the event says `partial: true`: `ahead`, `behind`,
          `base`, `mergeable` and `checks` are computed per request, so
          refetch getBranch for them.
        - default_heads: `push` (the first push of main) and
          `default_head.updated` (a merge). Row `{repo, default_branch,
          default_head}`. When main moves, every open branch's ahead, behind
          and mergeable change: refetch the branch list.
        - statuses: `status` (Status row).
        - ci_builds: `ci.build` (CiBuild row, upsert), on the build's repo.
        - ci_jobs: `ci.job` (CiJob row, upsert; key `<build>/<job>`), on the
          build's repo.
        - ci_connections: `ci.connection` (CiConnection row; delete on
          disconnect, row `{id}`).
        - reviews: `review` (Review row).
        - worktrees: `worktree.reported` (upsert), `worktree.removed` (delete).
        - meta_files: `meta.saved` (a meta history entry, no bytes; not sent
          during pando init's first upload).
        - presence: `machine.connected`, `machine.disconnected`. Row
          `{connections: [...]}`, the whole list of who is connected now (as in
          meta/status), plus `connection`, the one that changed.
        - machines: `machine.updated` (upsert, a Machine row; key
          `<login>/<credential_id>`). Sent at once for a new machine, a
          connect, a disconnect or a change of its worktrees; for activity
          alone at most once a minute per machine (every activity event
          already names its `actor` and `machine`).

        Topics (`?topics=`, comma-separated, at most 10): `all` (default),
        `main` (every default_heads event), `main:<repo>`, `repo:<repo>`,
        `meta` (meta_files and presence), `kind:<kind>`, `feed` (the
        activity lines as the person's feed shows them, as
        `{"type": "feed", "n", "event": FeedEvent}` frames: the home uses it
        for a monorepo of more than 100 members, and a monorepo's pages may).
        `pando worktree follow` needs only `main:<repo>`.

        The `feed` topic's lines are numbered `n` in the order they go out
        (a push's line goes out when its commit count is known, so `n` is not
        `seq` order). `caught_up` then carries `feed_n`, the last number
        sent. A socket that drops reconnects with `feed_since=<the last n it
        saw>` and first gets every line sent after it (at most 500, else one
        `{"type": "feed_resync", "feed_n"}`: refetch, then reconnect with that
        `feed_n`).

        Presence (the home's `machines_active` and `worktrees_active`): a
        follower sends, after the socket opens and whenever a worktree is
        added or removed on its machine,
        `{"type": "hello", "machine": "<machine>", "worktrees": ["<worktree id>", ...]}`:
        the ids it reported with putWorktree for its branch worktrees in this
        monorepo (not read-only mains), at most 1,000, each 1 to 64 of
        `A-Z a-z 0-9 _ -`. `machine` is optional (default: the credential's
        name). Each hello replaces the last one of that socket; presence ends
        when the socket closes. The hello also marks the socket's credential
        connected in listMachines, with these worktrees. Answer: `{"type": "hello_ok", "machine",
        "worktrees", "machines_active", "worktrees_active"}`, or an `error`
        frame.

        Without `Upgrade`: JSON, `?since=<seq>&limit=<n>` (at most 500), or the
        latest `limit` with no `since`. With `Upgrade: websocket`: events after
        `?since=` (at most 500, else one `{"type": "resync", "seq",
        "oldest_seq"}` frame: refetch, then resume from `seq`), then
        `{"type": "caught_up", "seq"}`, then live `{"type": "event", "seq", ...}`
        frames. The text `ping` gets `pong`. Close code 4404: the monorepo was
        deleted.

        Numbers and shas: `seq`, `oldest_seq` are stream sequence numbers. In
        an event, `head` and `before` (push and default_head events) are commit
        shas. Set `EVENT_STREAM` false in
        worker/src/monorepo/stream.ts and it answers 501 `event_stream_on_hold`.
      tags: [monorepos]
      parameters:
        - name: since
          in: query
          schema: { type: integer, minimum: 0 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
        - name: topics
          in: query
          schema: { type: string, default: all }
        - name: feed_since
          in: query
          description: "With `topics` including `feed`, on a WebSocket: replay the `feed` lines numbered after this."
          schema: { type: integer, minimum: 0 }
      responses:
        "200":
          description: A page of events
          content:
            application/json:
              schema:
                type: object
                required: [events, seq, oldest_seq, resync]
                properties:
                  events:
                    type: array
                    items: { $ref: "#/components/schemas/Event" }
                  seq: { type: integer, description: "The newest event's seq (0 when none)." }
                  oldest_seq: { type: integer, description: The oldest kept. }
                  resync: { type: boolean, description: "True when `since` is not in the stream; refetch everything." }
        "101": { description: The WebSocket. }
        "501":
          description: "`event_stream_on_hold`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/monorepos/{owner}/{monorepo}/members:
    parameters:
      - $ref: "#/components/parameters/owner"
      - $ref: "#/components/parameters/monorepo"
    get:
      operationId: listMembers
      summary: The monorepo's members
      tags: [monorepos]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [members]
                properties:
                  members:
                    type: array
                    items: { $ref: "#/components/schemas/Member" }
  /v1/monorepos/{owner}/{monorepo}/invites:
    parameters:
      - $ref: "#/components/parameters/owner"
      - $ref: "#/components/parameters/monorepo"
    post:
      operationId: invite
      summary: Invite a person by email (owners)
      description: |
        If someone has already signed in with that email, they are added now
        (200, `status: added`). Otherwise the invite waits (201,
        `status: invited`) and is accepted when that email first signs in with
        `pando login` (a verified email only).
      tags: [monorepos]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string }
                role: { $ref: "#/components/schemas/MemberRole" }
      responses:
        "200":
          description: Added as a member now
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [added] }
                  member: { $ref: "#/components/schemas/Member" }
        "201":
          description: Invited; waiting for that email to sign in
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [invited] }
                  invite: { $ref: "#/components/schemas/Invite" }
        "403": { $ref: "#/components/responses/Error" }
    get:
      operationId: listInvites
      summary: Invites still waiting
      tags: [monorepos]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [invites]
                properties:
                  invites:
                    type: array
                    items: { $ref: "#/components/schemas/Invite" }
  /v1/monorepos/{owner}/{monorepo}/invites/{email}:
    parameters:
      - $ref: "#/components/parameters/owner"
      - $ref: "#/components/parameters/monorepo"
      - name: email
        in: path
        required: true
        schema: { type: string }
    delete:
      operationId: revokeInvite
      summary: Withdraw an invite (owners)
      tags: [monorepos]
      responses:
        "204": { description: Withdrawn }
        "404": { $ref: "#/components/responses/Error" }
  /v1/monorepos/{owner}/{monorepo}/members/{login}:
    parameters:
      - $ref: "#/components/parameters/owner"
      - $ref: "#/components/parameters/monorepo"
      - name: login
        in: path
        required: true
        schema: { $ref: "#/components/schemas/Login" }
    put:
      operationId: putMember
      summary: Add a user to the monorepo, or change their role (owners)
      tags: [monorepos]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { $ref: "#/components/schemas/MemberRole" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Member" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: removeMember
      summary: Remove a user from the monorepo (owners; the last owner stays)
      tags: [monorepos]
      responses:
        "204": { description: Removed }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/monorepos/{owner}/{monorepo}/repos:
    parameters:
      - $ref: "#/components/parameters/owner"
      - $ref: "#/components/parameters/monorepo"
    post:
      operationId: createRepo
      summary: Create a repo in a monorepo
      description: |
        Makes the Artifacts repo and records it. It starts empty; the first
        push to `main` through the door (`pando init`) creates main. Refused
        in a monorepo of kind `repo` (it already has its one repo).
      tags: [repos]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path:
                  type: string
                  description: The repo path from the root, for example `projects/web` (formats.md). Its `name` is the path with `/` turned into `-`.
                description: { type: string }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Repo" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    get:
      operationId: listRepos
      summary: List repos
      tags: [repos]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [repos]
                properties:
                  repos:
                    type: array
                    items: { $ref: "#/components/schemas/Repo" }
  /v1/monorepos/{owner}/{monorepo}/repos/{repo}:
    parameters:
      - $ref: "#/components/parameters/owner"
      - $ref: "#/components/parameters/monorepo"
      - $ref: "#/components/parameters/repo"
    get:
      operationId: getRepo
      summary: Get a repo
      tags: [repos]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Repo" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/monorepos/{owner}/{monorepo}/repos/{repo}/branches:
    parameters:
      - $ref: "#/components/parameters/owner"
      - $ref: "#/components/parameters/monorepo"
      - $ref: "#/components/parameters/repo"
    get:
      operationId: listBranches
      summary: List branches with head, base, author, ahead and behind, mergeable and checks
      description: |
        Answered at once from stored facts. `ahead`, `behind`, `base` and
        `mergeable` are computed on change, by a queue: when a branch is
        pushed, and in a sweep when main moves (the 100 open branches pushed
        most recently in the last 7 days). Until a row's facts are for the
        current main and head it is `stale: true`, with `mergeable: "pending"`
        and `last_mergeable`; a `branch.updated` event brings the fresh row. A
        list computes at most 25 rows itself, those stale for over 30 s (a
        branch no sweep reaches). The default branch is not in the list; its
        name and head are at the top.
      tags: [branches]
      parameters:
        - name: state
          in: query
          schema:
            type: string
            enum: [open, merged, all]
            default: open
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
        - name: cursor
          in: query
          description: "`next_cursor` from the previous page."
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [default_branch, default_head, branches, next_cursor]
                properties:
                  default_branch: { type: string }
                  default_head:
                    type: [string, "null"]
                    description: null while the repo is empty.
                  branches:
                    type: array
                    items: { $ref: "#/components/schemas/Branch" }
                  next_cursor: { type: [string, "null"], description: "Pass as `cursor` for the next page; null on the last." }
    post:
      operationId: createBranch
      summary: Create a branch on the server, off main by default
      description: |
        Points a new branch at `from` (default: main's head) with no new
        commit. The caller becomes the branch's author. 409 `branch_exists` if
        it exists. The answer has `stale: true` until the branch's facts are
        computed (a `branch.updated` event follows).
      tags: [branches]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, description: "A git branch name, for example `agent-3/oauth`. Not the default branch." }
                from: { type: string, description: "A branch name or a full sha. Default: the default branch." }
                title: { type: string }
                description: { type: string }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Branch" }
        "409": { $ref: "#/components/responses/Error" }
        "503":
          description: "`repo_busy`: the repo's write slots stayed taken for 120 s."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/monorepos/{owner}/{monorepo}/repos/{repo}/branches/{branch}:
    parameters:
      - $ref: "#/components/parameters/owner"
      - $ref: "#/components/parameters/monorepo"
      - $ref: "#/components/parameters/repo"
      - $ref: "#/components/parameters/branch"
    get:
      operationId: getBranch
      summary: One branch, as in the list
      description: Answers from stored facts at once, like the list. It computes them first only when they have been stale for over 30 s, or with `?fresh=1`.
      tags: [branches]
      parameters:
        - name: fresh
          in: query
          description: "`1`: compute ahead, behind and mergeable now if stale (about 1 s)."
          schema: { type: string, enum: ["0", "1"], default: "0" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Branch" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteBranch
      summary: Delete a branch (not the default one)
      tags: [branches]
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503":
          description: "`repo_busy`: the repo's write slots stayed taken for 120 s."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    patch:
      operationId: updateBranch
      summary: Set the branch's title and description
      description: The merge commit's message is the title and description.
      tags: [branches]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                description: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Branch" }
  /v1/monorepos/{owner}/{monorepo}/repos/{repo}/branches/{branch}/commits:
    parameters:
      - $ref: "#/components/parameters/owner"
      - $ref: "#/components/parameters/monorepo"
      - $ref: "#/components/parameters/repo"
      - $ref: "#/components/parameters/branch"
    get:
      operationId: branchCommits
      summary: The branch's own commits, newest first, with Pando's trailers parsed
      description: |
        The commits on the branch that are not on the default branch (the
        ones `ahead` counts), in git log's order: each commit before its
        parents. `trailers` holds the who-made-it lines from formats.md,
        section 6 (`Pando-Agent`, `Pando-Worktree`, `Pando-Machine`), read from
        the message's last paragraph.
      tags: [branches]
      parameters:
        - name: limit
          in: query
          description: At most 250.
          schema: { type: integer, minimum: 1, maximum: 250, default: 250 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [branch, head, base_branch, merge_base, total, truncated, commits]
                properties:
                  branch: { type: string }
                  head: { type: string }
                  base_branch: { type: string }
                  merge_base: { type: [string, "null"] }
                  total: { type: integer, description: Commits on the branch only; may be more than returned. }
                  truncated: { type: boolean }
                  commits:
                    type: array
                    items: { $ref: "#/components/schemas/Commit" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/monorepos/{owner}/{monorepo}/repos/{repo}/branches/{branch}/diff:
    parameters:
      - $ref: "#/components/parameters/owner"
      - $ref: "#/components/parameters/monorepo"
      - $ref: "#/components/parameters/repo"
      - $ref: "#/components/parameters/branch"
    get:
      operationId: branchDiff
      summary: The branch diff (GitHub's three-dot diff, merge base to head)
      description: |
        Computed in the Worker from Artifacts reads, with no clone: the merge
        base, a walk of the two trees that skips equal subtrees, the changed
        blobs only, and a Myers line diff. Exact renames (the same blob moved)
        show as `renamed`; there is no similarity rename detection.

        `max_bytes` bounds the bytes of hunk lines returned. Files past the
        budget keep their entry with `patch_omitted: budget`. A text file over
        1 MiB on either side, or one whose diff is too big to compute, has
        `patch_omitted: too_large` and null counts.
      tags: [branches]
      parameters:
        - name: format
          in: query
          schema:
            type: string
            enum: [json, patch]
            default: json
        - name: hunks
          in: query
          description: "`1` to include per-file hunks in JSON."
          schema: { type: string, enum: ["0", "1"], default: "0" }
        - name: max_bytes
          in: query
          description: Budget for hunk bytes. Default 1048576, maximum 8388608.
          schema: { type: integer, minimum: 0 }
        - name: paths
          in: query
          description: Path prefixes, comma-separated or repeated (`paths=src/auth/&paths=README.md`).
          schema: { type: string }
      responses:
        "200":
          description: |
            JSON, or `text/x-patch` for `format=patch`: a unified diff with
            `diff --git` headers, ready for `git apply` or
            `plannotator review --patch-file -`. In patch form, files past the
            budget are left out and the response carries
            `X-Pando-Diff-Omitted: <count>`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Diff" }
            text/x-patch:
              schema: { type: string }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: "`no_merge_base`: the branch shares no history with the default branch."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/monorepos/{owner}/{monorepo}/repos/{repo}/branches/{branch}/reviews:
    parameters:
      - $ref: "#/components/parameters/owner"
      - $ref: "#/components/parameters/monorepo"
      - $ref: "#/components/parameters/repo"
      - $ref: "#/components/parameters/branch"
    post:
      operationId: createReview
      summary: Review a branch (a comment or an approval; not a gate)
      tags: [reviews]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [verdict]
              properties:
                verdict:
                  type: string
                  enum: [comment, request_changes, approve]
                body: { type: string }
                head:
                  type: string
                  description: The sha reviewed. Defaults to the branch head now.
                comments:
                  type: array
                  items: { $ref: "#/components/schemas/ReviewComment" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Review" }
    get:
      operationId: listReviews
      summary: The branch's reviews, oldest first
      tags: [reviews]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [reviews]
                properties:
                  reviews:
                    type: array
                    items: { $ref: "#/components/schemas/Review" }
  /v1/monorepos/{owner}/{monorepo}/repos/{repo}/branches/{branch}/merge:
    parameters:
      - $ref: "#/components/parameters/owner"
      - $ref: "#/components/parameters/monorepo"
      - $ref: "#/components/parameters/repo"
      - $ref: "#/components/parameters/branch"
    post:
      operationId: mergeBranch
      summary: Land the branch on the default branch with a merge commit (any member)
      description: |
        Any member may merge, agents included (like `gh pr merge`). Reviews
        are not a gate. Merges in one repo run one at a time. The merge commit
        is authored as the user. The gate: every required check (the repo's `required_checks`;
        with none set, every reported context) is `success` on the branch
        head. `force=1` merges past red or missing checks, and the merge is
        recorded as forced.
      tags: [merges]
      parameters:
        - name: force
          in: query
          schema: { type: string, enum: ["0", "1"], default: "0" }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  description: The merge commit message. Default "<title>\n\n<description>\n\nMerge branch '<branch>'", or "Merge branch '<branch>'" with no title.
                expected_head:
                  type: string
                  description: |
                    Refuse with 409 `head_moved` unless the branch head is this
                    sha. When it is the head Pando recorded for the branch (every
                    push is recorded before git is told it landed), the merge
                    uses the recorded heads and reads no refs, which is faster;
                    exactly this commit is merged.
      responses:
        "200":
          description: Merged, or already in the default branch.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MergeResult" }
        "409":
          description: "`conflict` (with `paths`: files changed differently on both sides; merge the default branch into the branch, push, and merge again), `head_moved`, or `ref_moved` (retry)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "412":
          description: "`checks_not_green`, with `checks`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: "`repo_busy`: the repo's write slots stayed taken for 120 s, or Artifacts stayed busy after 3 retries."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "501":
          description: "`merge_engine_unavailable`: the server-side merge engine is not wired in yet."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/monorepos/{owner}/{monorepo}/repos/{repo}/tree:
    parameters:
      - $ref: "#/components/parameters/owner"
      - $ref: "#/components/parameters/monorepo"
      - $ref: "#/components/parameters/repo"
    get:
      operationId: getTree
      summary: A folder at any ref (FILES.md section 1)
      description: |
        Folders first, then by name; 1,000 entries a page. Read by hash
        through the edge cache: a repeat view reaches no Artifacts call. A
        branch name resolves from Pando's stored heads; a sha that is not in
        this repo is a 404. No sizes (git trees have none).
      tags: [repos]
      parameters:
        - { name: ref, in: query, description: "A branch name (`/` as is, URL-encoded) or a 40-character sha. Default: the default branch.", schema: { type: string } }
        - { name: path, in: query, description: "The folder, `a/b/c`. Default: the root.", schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000, default: 1000 } }
        - { name: cursor, in: query, description: A `next` from an earlier page., schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [ref, commit, path, entries, total, next]
                properties:
                  ref: { type: string }
                  commit: { type: string, description: The commit the ref resolved to. }
                  path: { type: string }
                  entries: { type: array, items: { $ref: "#/components/schemas/TreeEntry" } }
                  total: { type: integer }
                  next: { type: [string, "null"] }
        "400": { $ref: "#/components/responses/Error" }
        "404": { description: "`not_found` (ref, commit or path), or `not_a_folder`.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/monorepos/{owner}/{monorepo}/repos/{repo}/tree/last-commits:
    parameters:
      - $ref: "#/components/parameters/owner"
      - $ref: "#/components/parameters/monorepo"
      - $ref: "#/components/parameters/repo"
    get:
      operationId: getLastCommits
      summary: The last commit that changed each entry of a folder (FILES.md section 2)
      description: |
        First parents (`git log -1 --first-parent -- <entry>`): on main, a
        change merged from a branch is the merge, with `merged_branch`. A
        complete answer is stored (it never changes) and reused by later
        commits' answers. A walk stops after about 40 Artifacts reads: the
        answer then has `complete: false`, the entries found so far (null for
        the rest), and `retry_after_ms`; a job finishes it. Entries unchanged
        within 10,000 commits stay null with `older.before`.
      tags: [repos]
      parameters:
        - { name: ref, in: query, schema: { type: string } }
        - { name: path, in: query, schema: { type: string } }
        - { name: names, in: query, description: "Comma-separated entry names (a page of a large folder). Default: all.", schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [ref, commit, path, complete, entries, older, retry_after_ms]
                properties:
                  ref: { type: string }
                  commit: { type: string }
                  path: { type: string }
                  complete: { type: boolean }
                  entries:
                    type: object
                    additionalProperties:
                      oneOf:
                        - $ref: "#/components/schemas/CommitLine"
                        - type: "null"
                  older: { type: [object, "null"], properties: { before: { type: string, format: date-time } } }
                  retry_after_ms: { type: [integer, "null"] }
        "404": { $ref: "#/components/responses/Error" }
  /v1/monorepos/{owner}/{monorepo}/repos/{repo}/history:
    parameters:
      - $ref: "#/components/parameters/owner"
      - $ref: "#/components/parameters/monorepo"
      - $ref: "#/components/parameters/repo"
    get:
      operationId: getHistory
      summary: Commits that changed one path, newest first (FILES.md section 6)
      description: |
        `git log --first-parent -- <path>`, paged. A page may stop short of
        `limit` when its walk spent its budget (`complete_page: false`); ask
        again with `next`. Renames are not followed. The walk stops at
        10,000 commits from the ref (`capped`).
      tags: [repos]
      parameters:
        - { name: ref, in: query, schema: { type: string } }
        - { name: path, in: query, description: "A file or a folder. Default: the root (every commit).", schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 30 } }
        - { name: cursor, in: query, description: A `next` from an earlier page., schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [ref, path, commits, next, capped, complete_page]
                properties:
                  ref: { type: [string, "null"], description: Null on a page asked with a cursor. }
                  path: { type: string }
                  commits: { type: array, items: { $ref: "#/components/schemas/CommitLine" } }
                  next: { type: [string, "null"] }
                  capped: { type: boolean }
                  complete_page: { type: boolean }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/monorepos/{owner}/{monorepo}/repos/{repo}/files/{path}:
    parameters:
      - $ref: "#/components/parameters/owner"
      - $ref: "#/components/parameters/monorepo"
      - $ref: "#/components/parameters/repo"
      - name: path
        in: path
        required: true
        description: Repository-relative path; slashes as they are.
        schema: { type: string }
    get:
      operationId: getFile
      summary: One file's bytes at a ref
      tags: [repos]
      parameters:
        - name: ref
          in: query
          description: A branch, tag or sha. Defaults to the default branch.
          schema: { type: string }
      responses:
        "200":
          description: The raw bytes, with a sniffed Content-Type.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/Error" }
  /v1/monorepos/{owner}/{monorepo}/repos/{repo}/statuses/{sha}:
    parameters:
      - $ref: "#/components/parameters/owner"
      - $ref: "#/components/parameters/monorepo"
      - $ref: "#/components/parameters/repo"
      - name: sha
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: createStatus
      summary: Report a commit status (GitHub's body)
      description: |
        With a member's credential, the status shows that member as
        `creator` and has `app` null, whatever the body says.

        With a status token (`PANDO_STATUS_TOKEN` in a Buildkite build's
        env, `status_token` in a web hook's payload), Pando stamps `app` from
        the hook that delivered it (`buildkite`, a web hook's own `app`, or
        null) and `creator` `app:<slug>` (`hook:<hook id>` when null). A
        status token posts statuses for its one commit in its one repo, for
        24 hours, on this route only: no other route and no git.
      tags: [statuses]
      security:
        - credential: []
        - session: []
        - statusToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [state]
              properties:
                state: { $ref: "#/components/schemas/StatusState" }
                context: { type: string, default: default }
                target_url: { type: string }
                description: { type: string }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Status" }
        "401":
          description: "`unauthorized`: not a credential, or a status token that is not valid. `status_token_expired`: older than 24 hours. `status_tokens_off`: the Worker secret PANDO_STATUS_SECRET is not set."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: "`status_token_scope`: the token is for another commit, repo or monorepo. `status_token_route` (on any other route): a status token works here only."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/monorepos/{owner}/{monorepo}/repos/{repo}/commits/{ref}/status:
    parameters:
      - $ref: "#/components/parameters/owner"
      - $ref: "#/components/parameters/monorepo"
      - $ref: "#/components/parameters/repo"
      - name: ref
        in: path
        required: true
        description: A sha or a branch name (`%2F` for slashes).
        schema: { type: string }
    get:
      operationId: combinedStatus
      summary: The combined status of a commit (latest per context)
      tags: [statuses]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Checks" }
  /v1/monorepos/{owner}/{monorepo}/repos/{repo}/hooks:
    parameters:
      - $ref: "#/components/parameters/owner"
      - $ref: "#/components/parameters/monorepo"
      - $ref: "#/components/parameters/repo"
    post:
      operationId: createHook
      summary: Register a hook (owners)
      description: |
        `web`: a signed JSON POST to `url` (see `webhooks` below).
        `buildkite`: Pando calls Buildkite's create-build API,
        `POST https://api.buildkite.com/v2/organizations/{organization}/pipelines/{pipeline}/builds`,
        with the Worker secret `BUILDKITE_API_TOKEN`, for `push` events (by
        default) on branches that are not deleted. The build gets `commit`,
        `branch`, `message`, and `env`: `PANDO_CLONE_URL`, `PANDO_READ_TOKEN`
        (read only, this repo, at least 24 hours: Buildkite's Retry reruns a
        job with this env), `PANDO_STATUS_URL`, `PANDO_STATUS_TOKEN` (posts
        checks on this commit for 24 hours, stamped `buildkite`; see
        createStatus; `pando status <state>` uses it), `PANDO_MONOREPO`,
        `PANDO_REPO`, `PANDO_BRANCH`, `PANDO_HEAD`, `PANDO_DELIVERY`,
        `PANDO_SEQ`. Its `meta_data` has `pando_delivery`, `pando_monorepo`
        (the id) and `pando_repo`, which Pando's Buildkite webhook uses to map
        the build back (the `ci` tag).
      tags: [hooks]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type:
                  type: string
                  enum: [web, buildkite]
                url:
                  type: string
                  description: Required for `web`.
                secret:
                  type: string
                  description: For `web`, the HMAC key. Write only.
                events:
                  type: array
                  items: { $ref: "#/components/schemas/HookEvent" }
                  description: Default `[push, branch.opened, merged]` for web, `[push]` for buildkite.
                buildkite:
                  type: object
                  required: [organization, pipeline]
                  properties:
                    organization: { type: string }
                    pipeline: { type: string }
                app:
                  type: string
                  pattern: "^[a-z0-9][a-z0-9-]{0,38}$"
                  description: "For `web`: the CI service behind it (`github-actions`, `circleci`, ...), stamped as `app` on statuses posted with its deliveries' status tokens. Not `buildkite` (that is the `buildkite` type's)."
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Hook" }
    get:
      operationId: listHooks
      summary: List hooks
      tags: [hooks]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [hooks]
                properties:
                  hooks:
                    type: array
                    items: { $ref: "#/components/schemas/Hook" }
  /v1/monorepos/{owner}/{monorepo}/repos/{repo}/hooks/{hook_id}:
    parameters:
      - $ref: "#/components/parameters/owner"
      - $ref: "#/components/parameters/monorepo"
      - $ref: "#/components/parameters/repo"
      - name: hook_id
        in: path
        required: true
        schema: { type: string }
    delete:
      operationId: deleteHook
      summary: Remove a hook (owners)
      tags: [hooks]
      responses:
        "204": { description: Removed }
  /v1/monorepos/{owner}/{monorepo}/repos/{repo}/hooks/{hook_id}/deliveries:
    parameters:
      - $ref: "#/components/parameters/owner"
      - $ref: "#/components/parameters/monorepo"
      - $ref: "#/components/parameters/repo"
      - name: hook_id
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: listDeliveries
      summary: The hook's deliveries, newest first (last 100)
      tags: [hooks]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [deliveries]
                properties:
                  deliveries:
                    type: array
                    items: { $ref: "#/components/schemas/Delivery" }
  /v1/monorepos/{owner}/{monorepo}/repos/{repo}/hooks/{hook_id}/redeliver:
    parameters:
      - $ref: "#/components/parameters/owner"
      - $ref: "#/components/parameters/monorepo"
      - $ref: "#/components/parameters/repo"
      - name: hook_id
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: replayHook
      summary: Replay a hook from a seq, after an outage (owners)
      description: Every delivery of this hook with a seq above `since` is sent again, oldest first, at most 1,000, each with a fresh round of five tries. Only changes made while the hook existed have deliveries.
      tags: [hooks]
      parameters:
        - name: since
          in: query
          required: true
          schema: { type: integer, minimum: 0 }
      responses:
        "202":
          description: Queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  queued: { type: integer }
                  ids:
                    type: array
                    items: { type: string }
        "404": { $ref: "#/components/responses/Error" }
  /v1/monorepos/{owner}/{monorepo}/repos/{repo}/hooks/deliveries/{delivery_id}/redeliver:
    parameters:
      - $ref: "#/components/parameters/owner"
      - $ref: "#/components/parameters/monorepo"
      - $ref: "#/components/parameters/repo"
      - name: delivery_id
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: redeliver
      summary: Send a delivery again (owners)
      description: The same delivery (same id and seq) is sent again now, with a fresh read token and a fresh round of five tries; `attempts` keeps counting.
      tags: [hooks]
      responses:
        "202":
          description: Queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Delivery" }
  /v1/monorepos/{owner}/{monorepo}/machines:
    parameters:
      - $ref: "#/components/parameters/owner"
      - $ref: "#/components/parameters/monorepo"
    get:
      operationId: listMachines
      summary: The Machines tab, one row per machine (a credential), latest activity first
      description: |
        A machine is a credential: the row's key is (login, credential_id),
        and it is shown by the credential's name, so two people's `laptop`s
        stay apart. Kept by the monorepo in the same step as each change:
        - every activity event made through the credential sets
          `last_activity` (the line's kind, repo, branch and summary, as in
          FeedEvent; a push's commit count and title arrive a moment later);
        - a follower's hello on the event socket sets it `connected`, with its
          worktrees; its last such socket closing sets it disconnected.
        Machines with no activity yet (only connected) come after the others.
        Browser sessions (kind `browser`) appear only once they act, never as
        connected; show them as the web. Live: `machine.updated` on the event
        stream.
      tags: [worktrees]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [machines]
                properties:
                  machines:
                    type: array
                    items: { $ref: "#/components/schemas/Machine" }
  /v1/monorepos/{owner}/{monorepo}/worktrees:
    parameters:
      - $ref: "#/components/parameters/owner"
      - $ref: "#/components/parameters/monorepo"
    get:
      operationId: listWorktrees
      summary: Every worktree in the monorepo, across machines
      tags: [worktrees]
      parameters:
        - name: machine
          in: query
          schema: { type: string }
        - name: repo
          in: query
          description: A repo path.
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [worktrees]
                properties:
                  worktrees:
                    type: array
                    items: { $ref: "#/components/schemas/Worktree" }
  /v1/monorepos/{owner}/{monorepo}/worktrees/{worktree_id}:
    parameters:
      - $ref: "#/components/parameters/owner"
      - $ref: "#/components/parameters/monorepo"
      - name: worktree_id
        in: path
        required: true
        description: Made by the client (formats.md, `wt_` and 16 hex characters).
        schema: { type: string, pattern: "^[A-Za-z0-9_-]{1,64}$" }
    put:
      operationId: putWorktree
      summary: Report a worktree (creates it, or replaces the one with this id)
      description: Each call also refreshes `last_seen_at`.
      tags: [worktrees]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [repo, branch, path, machine, kind]
              properties:
                repo: { type: string, description: "The repo path (`projects/web`, or `.`)." }
                branch: { type: string }
                path: { type: string, description: "The worktree path from the root (formats.md, section 1)." }
                machine: { type: string }
                agent: { type: [string, "null"], description: "The agent working in it, if any (PANDO_AGENT)." }
                kind: { type: string, enum: [fuse, sparse, fskit] }
      responses:
        "200":
          description: The worktree as stored.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Worktree" }
        "403": { $ref: "#/components/responses/Error" }
    get:
      operationId: getWorktree
      summary: One worktree
      tags: [worktrees]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Worktree" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: removeWorktree
      summary: Remove a worktree from the registry
      tags: [worktrees]
      responses:
        "204": { description: Removed }
        "404": { $ref: "#/components/responses/Error" }
  /v1/monorepos/{owner}/{monorepo}/ci:
    parameters:
      - $ref: "#/components/parameters/owner"
      - $ref: "#/components/parameters/monorepo"
    get:
      operationId: getCi
      summary: The CI tab's top - services, connections, pipelines, required checks
      tags: [ci]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [services, connections, pipelines, required_checks]
                properties:
                  services:
                    type: array
                    description: The services Pando can connect.
                    items:
                      type: object
                      properties:
                        service: { type: string }
                        name: { type: string }
                  connections:
                    type: array
                    items: { $ref: "#/components/schemas/CiConnection" }
                  pipelines:
                    type: array
                    description: Each connection's pipelines - those its builds named, and those a buildkite hook names.
                    items: { $ref: "#/components/schemas/CiPipeline" }
                  required_checks:
                    type: array
                    description: Every repo's required checks, read from `.pando/pando.toml` (a repo with no pipeline is here too).
                    items:
                      type: object
                      properties:
                        repo: { type: string }
                        path: { type: string }
                        checks:
                          type: array
                          items: { type: string }
        "403": { $ref: "#/components/responses/Error" }
  /v1/monorepos/{owner}/{monorepo}/ci/connections:
    parameters:
      - $ref: "#/components/parameters/owner"
      - $ref: "#/components/parameters/monorepo"
    post:
      operationId: createCiConnection
      summary: Connect a CI service (owners)
      description: |
        Answers the webhook URL to paste into the service, and its token
        (`webhook_token`), shown this once. For Buildkite: Organization
        Settings, Notification Services, Add, Webhook; the URL; the token,
        sent as `X-Buildkite-Token` or (better) signed as
        `X-Buildkite-Signature`; events `build.*` and `job.*`; the pipelines
        to send. One connection per organization per monorepo. REST calls
        use the Worker secret `BUILDKITE_API_TOKEN` at launch (the connection
        says `token: worker_secret`); per-connection tokens come with C21.
      tags: [ci]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [service, organization]
              properties:
                service: { type: string, enum: [buildkite] }
                organization: { type: string, description: "The organization's slug, as in buildkite.com/<slug>." }
                webhook_token:
                  type: string
                  minLength: 16
                  maxLength: 200
                  description: The service's own webhook token, if it made one; else Pando makes one.
      responses:
        "201":
          description: Connected
          content:
            application/json:
              schema:
                type: object
                required: [connection, webhook_token]
                properties:
                  connection: { $ref: "#/components/schemas/CiConnection" }
                  webhook_token: { type: string, description: Shown once. }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409":
          description: "`ci_connection_exists`: this organization is connected already."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/monorepos/{owner}/{monorepo}/ci/connections/{connection}:
    parameters:
      - $ref: "#/components/parameters/owner"
      - $ref: "#/components/parameters/monorepo"
      - $ref: "#/components/parameters/ciConnection"
    delete:
      operationId: deleteCiConnection
      summary: Disconnect a CI service (owners)
      description: Its pipelines, builds, jobs and cached details go; its checks stay (they are commit statuses). Its webhook URL then answers 404.
      tags: [ci]
      responses:
        "204": { description: Disconnected }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/monorepos/{owner}/{monorepo}/ci/builds:
    parameters:
      - $ref: "#/components/parameters/owner"
      - $ref: "#/components/parameters/monorepo"
    get:
      operationId: listCiBuilds
      summary: Stored builds, newest first
      tags: [ci]
      parameters:
        - { name: repo, in: query, schema: { type: string } }
        - { name: branch, in: query, schema: { type: string } }
        - { name: sha, in: query, schema: { type: string }, description: A full sha. }
        - { name: pipeline, in: query, schema: { type: string } }
        - { name: connection, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { $ref: "#/components/schemas/CiState" } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 30 } }
        - { name: cursor, in: query, schema: { type: string }, description: "`next_cursor` from the previous page." }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [builds, next_cursor]
                properties:
                  builds:
                    type: array
                    items: { $ref: "#/components/schemas/CiBuild" }
                  next_cursor: { type: [string, "null"] }
        "400": { $ref: "#/components/responses/Error" }
  /v1/monorepos/{owner}/{monorepo}/ci/builds/{build}:
    parameters:
      - $ref: "#/components/parameters/owner"
      - $ref: "#/components/parameters/monorepo"
      - $ref: "#/components/parameters/ciBuild"
    get:
      operationId: getCiBuild
      summary: A build and its jobs
      tags: [ci]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/CiBuild"
                  - type: object
                    required: [jobs]
                    properties:
                      jobs:
                        type: array
                        description: First scheduled first. Wait steps are left out.
                        items: { $ref: "#/components/schemas/CiJob" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/monorepos/{owner}/{monorepo}/ci/builds/{build}/jobs/{job}/log:
    parameters:
      - $ref: "#/components/parameters/owner"
      - $ref: "#/components/parameters/monorepo"
      - $ref: "#/components/parameters/ciBuild"
      - $ref: "#/components/parameters/ciJob"
    get:
      operationId: getCiJobLog
      summary: A job's log, from the service (its last 1 MiB)
      description: Raw, with the service's escape codes (ANSI colours, Buildkite's timestamps). `Cache-Control` is immutable once `complete`.
      tags: [ci]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [job, content, bytes, total_bytes, truncated, complete, fetched_at, cached]
                properties:
                  job: { type: string }
                  content: { type: string }
                  bytes: { type: integer, description: The bytes in `content`. }
                  total_bytes: { type: integer, description: The whole log's size. }
                  truncated: { type: boolean, description: True when `content` is the log's last 1 MiB only. }
                  complete: { type: boolean, description: The job finished over 30 s ago; this never changes again. }
                  fetched_at: { type: string, format: date-time }
                  cached: { type: boolean }
        "404": { $ref: "#/components/responses/Error" }
        "413":
          description: "`log_too_large`: the log is over 64 MiB; open it in the service (`web_url`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/monorepos/{owner}/{monorepo}/ci/builds/{build}/annotations:
    parameters:
      - $ref: "#/components/parameters/owner"
      - $ref: "#/components/parameters/monorepo"
      - $ref: "#/components/parameters/ciBuild"
    get:
      operationId: listCiAnnotations
      summary: A build's annotations, from the service (first 100)
      tags: [ci]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [annotations, truncated, complete, fetched_at, cached]
                properties:
                  annotations:
                    type: array
                    items: { $ref: "#/components/schemas/CiAnnotation" }
                  truncated: { type: boolean, description: The build has more than 100. }
                  complete: { type: boolean }
                  fetched_at: { type: string, format: date-time }
                  cached: { type: boolean }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/monorepos/{owner}/{monorepo}/ci/builds/{build}/artifacts:
    parameters:
      - $ref: "#/components/parameters/owner"
      - $ref: "#/components/parameters/monorepo"
      - $ref: "#/components/parameters/ciBuild"
    get:
      operationId: listCiArtifacts
      summary: A build's artifacts, from the service (first 100)
      tags: [ci]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [artifacts, truncated, complete, fetched_at, cached]
                properties:
                  artifacts:
                    type: array
                    items: { $ref: "#/components/schemas/CiArtifact" }
                  truncated: { type: boolean }
                  complete: { type: boolean }
                  fetched_at: { type: string, format: date-time }
                  cached: { type: boolean }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/monorepos/{owner}/{monorepo}/ci/builds/{build}/artifacts/{artifact}/download:
    parameters:
      - $ref: "#/components/parameters/owner"
      - $ref: "#/components/parameters/monorepo"
      - $ref: "#/components/parameters/ciBuild"
      - name: artifact
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: downloadCiArtifact
      summary: Download an artifact of this build
      description: A 302 to the service's own download URL, which Buildkite keeps good for about 60 seconds. Only an artifact of this build.
      tags: [ci]
      responses:
        "302": { description: "`Location` is the download." }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/monorepos/{owner}/{monorepo}/ci/builds/{build}/rebuild:
    parameters:
      - $ref: "#/components/parameters/owner"
      - $ref: "#/components/parameters/monorepo"
      - $ref: "#/components/parameters/ciBuild"
    post:
      operationId: rebuildCiBuild
      summary: Build the same commit again, with fresh tokens
      description: |
        A new build in the same pipeline, for the same commit and branch,
        with the env a hook delivery gives (a fresh `PANDO_READ_TOKEN` and
        `PANDO_STATUS_TOKEN`) and `meta_data.pando_rebuild_of`. Recorded at
        once. Needs `write_builds` on the token.
      tags: [ci]
      responses:
        "201":
          description: Started
          content:
            application/json:
              schema:
                type: object
                properties:
                  build: { $ref: "#/components/schemas/CiBuild" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/monorepos/{owner}/{monorepo}/ci/builds/{build}/cancel:
    parameters:
      - $ref: "#/components/parameters/owner"
      - $ref: "#/components/parameters/monorepo"
      - $ref: "#/components/parameters/ciBuild"
    post:
      operationId: cancelCiBuild
      summary: Cancel a running build (passed through)
      description: "409 `ci_finished` when it has finished. Needs `write_builds`."
      tags: [ci]
      responses:
        "202":
          description: Canceling
          content:
            application/json:
              schema:
                type: object
                properties:
                  build: { $ref: "#/components/schemas/CiBuild" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/monorepos/{owner}/{monorepo}/ci/builds/{build}/jobs/{job}/retry:
    parameters:
      - $ref: "#/components/parameters/owner"
      - $ref: "#/components/parameters/monorepo"
      - $ref: "#/components/parameters/ciBuild"
      - $ref: "#/components/parameters/ciJob"
    post:
      operationId: retryCiJob
      summary: Retry a job (passed through)
      description: |
        The service reruns the job with the build's original env, so it can
        clone for as long as the build's read token lives: at least 24 hours
        after Pando started the build. The new job is recorded at once and
        its check goes back to pending. Needs `write_builds`.
      tags: [ci]
      responses:
        "202":
          description: Retrying
          content:
            application/json:
              schema:
                type: object
                properties:
                  job:
                    oneOf:
                      - $ref: "#/components/schemas/CiJob"
                      - type: "null"
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/monorepos/{owner}/{monorepo}/ci/pipelines/{pipeline}:
    parameters:
      - $ref: "#/components/parameters/owner"
      - $ref: "#/components/parameters/monorepo"
      - name: pipeline
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getCiPipeline
      summary: A pipeline - its configuration (pipeline.yml) and its builds
      description: |
        The configuration is the service's (Buildkite's pipeline YAML, as set
        in Buildkite), read at most every 5 minutes. A pipeline that uploads
        its steps from the repo shows the upload step here; the repo's own
        file is on the Code tab. When the read fails, the last copy is
        shown with `configuration_error`.
      tags: [ci]
      parameters:
        - { name: connection, in: query, schema: { type: string }, description: Needed only when two connections have a pipeline of this name. }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 30 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [pipeline, builds, next_cursor]
                properties:
                  pipeline:
                    allOf:
                      - $ref: "#/components/schemas/CiPipeline"
                      - type: object
                        properties:
                          configuration: { type: [string, "null"] }
                          configuration_fetched_at: { type: [string, "null"], format: date-time }
                          configuration_error:
                            type: [object, "null"]
                            properties:
                              code: { type: string }
                              message: { type: string }
                  builds:
                    type: array
                    items: { $ref: "#/components/schemas/CiBuild" }
                  next_cursor: { type: [string, "null"] }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/integrations/buildkite/{connection}:
    parameters:
      - $ref: "#/components/parameters/ciConnection"
    post:
      operationId: buildkiteWebhook
      summary: Buildkite's webhooks (the URL a connection shows)
      description: |
        Buildkite's own request: `X-Buildkite-Event`, and either
        `X-Buildkite-Signature: timestamp=<unix s>,signature=<hex>` (HMAC-SHA256
        of `<timestamp>.<raw body>` keyed by the connection's webhook token;
        refused when over 5 minutes off) or `X-Buildkite-Token`. Events used:
        `build.*` and `job.*` (and `ping`). Bodies up to 5 MiB. The build,
        its job and its check are written with their events before the
        answer. Events are applied in the order Buildkite signed them (in
        whole seconds; with a plain token, the order they arrive); a job's
        state never moves back, and a job event's copy of a build never moves
        a finished build back.
      tags: [ci]
      security: []
      requestBody:
        content:
          application/json:
            schema: { type: object }
      responses:
        "200":
          description: "`recorded`, or `ignored` with a reason (another monorepo's, another organization's, or a pipeline that builds no repo here)."
          content:
            application/json:
              schema:
                type: object
                required: [result]
                properties:
                  result: { type: string, enum: [recorded, ignored] }
                  reason: { type: string }
                  build: { type: string, description: The Pando build id. }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
webhooks:
  hookDelivery:
    post:
      operationId: hookDelivery
      summary: What a `web` hook receives
      description: |
        Headers: `X-Pando-Event` (the event), `X-Pando-Delivery` (the
        delivery id), `X-Pando-Signature-256: sha256=<hex>` (HMAC-SHA256 of
        the raw body with the hook's secret; GitHub's scheme under another
        name).

        Deliveries run on a queue: at least once and not in order, like
        GitHub's. The body's `seq` is the event stream's sequence number:
        drop a seq you have seen, and sort by it. A try that does not get a
        2xx within 10 seconds is retried after 10 s, 1 min, 5 min and 30 min
        (5 tries over about 36 minutes); then the delivery is dead until an
        owner redelivers it or replays the hook. Delivery records are kept for
        the latest 1,000 per hook, with each one's last 10 tries.
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HookPayload" }
      responses:
        "200": { description: Any 2xx counts as delivered. }
components:
  securitySchemes:
    credential:
      type: http
      scheme: bearer
      description: "A user's credential (`pando_` and 40 hex characters). Git sends it as the Basic password."
    session:
      type: apiKey
      in: cookie
      name: __Host-pando_session
      description: A browser session (kind browser), set by /v1/login/callback. /v1 only; writes need Pando's own Origin.
    bootstrap:
      type: http
      scheme: bearer
      description: The Worker secret PANDO_BOOTSTRAP.
    statusToken:
      type: http
      scheme: bearer
      description: "A status token, `pst1.<payload>.<signature>`: one per hook delivery, signed with the Worker secret PANDO_STATUS_SECRET, good for createStatus on one commit in one repo for 24 hours."
  parameters:
    owner:
      name: owner
      in: path
      required: true
      description: The monorepo's owner, a namespace (a person's login). Matched without case.
      schema: { $ref: "#/components/schemas/Login" }
    monorepo:
      name: monorepo
      in: path
      required: true
      description: The monorepo's name within its owner (or an old name). Matched without case.
      schema: { $ref: "#/components/schemas/Name" }
    repo:
      name: repo
      in: path
      required: true
      description: The repo's `name` (`projects-web`).
      schema: { type: string }
    branch:
      name: branch
      in: path
      required: true
      description: The branch name, `/` encoded as `%2F`.
      schema: { type: string }
    ciConnection:
      name: connection
      in: path
      required: true
      description: "A CI connection's id: `<monorepo id>--cic_<12 hex>`."
      schema: { type: string }
    ciBuild:
      name: build
      in: path
      required: true
      description: "Pando's build id (`cib_<16 hex>`)."
      schema: { type: string }
    ciJob:
      name: job
      in: path
      required: true
      description: The service's job id.
      schema: { type: string }
  responses:
    Error:
      description: An error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Name:
      type: string
      pattern: "^[a-z0-9](?:[a-z0-9._]|-(?!-)){0,38}$"
      description: "A monorepo name, unique within its owner: lower-case letters, digits, `.`, `_`, `-`; starts with a letter or digit; no `--`; at most 39 characters. Input in any case is lowered."
    Login:
      type: string
      pattern: "^[a-z0-9](?:[a-z0-9]|-(?=[a-z0-9])){0,38}$"
      description: "A user's login, which is their namespace (organizations share the same space, later): 1 to 39 lower-case letters, digits and single hyphens, no hyphen at either end (input in any case is lowered). Reserved, because a namespace is the first URL segment: v1, healthz, login, logout, settings, assets, fonts, new, api, app, static, orgs, users, docs. A login made at sign-in comes from the email's local part, skipping reserved and taken names (`base`, `base-2`, ... `base-999`, then a random tail)."
    MemberRole:
      type: string
      enum: [owner, member]
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            paths:
              type: array
              items: { type: string }
            checks: { $ref: "#/components/schemas/Checks" }
    Monorepo:
      type: object
      required: [id, owner, name, full_name, kind, created_at]
      properties:
        id: { type: string, description: "Permanent: `m_` and 16 hex characters, or, for a monorepo made before namespaces, its old name." }
        owner: { $ref: "#/components/schemas/Login" }
        name: { $ref: "#/components/schemas/Name" }
        full_name: { type: string, description: "`owner/name`." }
        kind: { type: string, enum: [monorepo, repo] }
        role: { $ref: "#/components/schemas/MemberRole" }
        created_at: { type: string, format: date-time }
    TreeEntry:
      type: object
      required: [name, type, mode, oid]
      properties:
        name: { type: string }
        type: { type: string, enum: [dir, file, symlink, submodule] }
        mode: { type: string, description: "git's mode: `100644`, `100755` (executable), `120000`, `40000`, `160000`." }
        oid: { type: string, description: The object's hash (a blob for files; read it with raw). }
    CommitLine:
      type: object
      required: [sha, title, author, at, merged_branch]
      properties:
        sha: { type: string }
        title: { type: string, description: The message's first line. }
        author: { type: object, properties: { name: { type: string }, email: { type: string } } }
        at: { type: string, format: date-time, description: The author date. }
        merged_branch:
          type: [object, "null"]
          description: On a merge into main, the branch it merged.
          properties:
            branch: { type: string }
            title: { type: [string, "null"] }
    ReplacedAlias:
      type: [object, "null"]
      description: An old `owner/name` (from a rename or transfer) that led to another monorepo and now leads to this one. Null when nothing was taken over. Never silent.
      required: [full_name, pointed_to]
      properties:
        full_name: { type: string, description: "The old name, now this monorepo's." }
        pointed_to: { type: [string, "null"], description: "The `owner/name` it led to before." }
    User:
      type: object
      required: [login, picture_url, created_at]
      properties:
        login: { type: string }
        name: { type: [string, "null"] }
        email: { type: [string, "null"] }
        picture_url:
          type: [string, "null"]
          description: >-
            Their WorkOS profile picture (an https URL of at most 2,048
            characters), stored at each sign-in, browser or `pando login`, and
            refreshed every time (a removed picture becomes null). Null when
            there is none or it is not https: the web draws one. Pando never
            fetches, proxies or caches it.
        created_at: { type: string, format: date-time }
    Credential:
      type: object
      required: [id, name, kind, created_at]
      properties:
        id: { type: string }
        name: { type: string }
        kind: { type: string, enum: [machine, sandbox, bootstrap, browser] }
        created_at: { type: string, format: date-time }
        last_used_at: { type: [string, "null"], format: date-time }
        expires_at: { type: [string, "null"], format: date-time, description: "Browser sessions only: the end unless used before then (each use pushes it to 30 days)." }
    NewCredential:
      allOf:
        - $ref: "#/components/schemas/Credential"
        - type: object
          required: [secret]
          properties:
            secret:
              type: string
              description: "`pando_` and 40 hex characters. Shown once; Pando keeps only its SHA-256."
    Invite:
      type: object
      required: [email, role, invited_by, created_at]
      properties:
        email: { type: string }
        role: { $ref: "#/components/schemas/MemberRole" }
        invited_by: { type: string }
        created_at: { type: string, format: date-time }
    Event:
      type: object
      required: [seq, at, kind, collection, key, op, row]
      properties:
        seq: { type: integer }
        at: { type: string, format: date-time }
        kind: { type: string }
        collection: { type: [string, "null"] }
        key: { type: [string, "null"] }
        op: { type: [string, "null"], enum: [upsert, delete, null] }
        repo: { type: [string, "null"] }
        actor: { type: [string, "null"], description: The user's login. }
        machine: { type: [string, "null"], description: The credential's name. }
        agent: { type: [string, "null"] }
        row: { description: "The changed row in its REST shape; on a delete, the last row (or its key fields)." }
        partial: { type: boolean, description: "True on branch events: the row has the branch's stored fields only." }
    FeedEvent:
      type: object
      description: One line of the activity log (listActivity, the person's socket, the `feed` topic).
      required: [monorepo, monorepo_id, seq, at, kind, repo, repo_path, branch, actor, machine, summary]
      properties:
        monorepo: { type: string, description: "`owner/name`, as it is when the line is read." }
        monorepo_id: { type: string, description: "The monorepo's id. Pages sort by (at, monorepo_id, seq)." }
        seq: { type: integer, description: "The monorepo's event seq. `(monorepo_id, seq)` is the line's identity." }
        at: { type: string, format: date-time }
        kind: { type: string, enum: [push, branch.opened, branch.deleted, merged, review, status, worktree.reported, worktree.removed, meta.saved] }
        repo: { type: [string, "null"], description: The repo's name in URLs (`meta` for the meta layer). }
        repo_path: { type: [string, "null"], description: "`projects/web`; `.` for the meta layer and a plain repo." }
        branch: { type: [string, "null"] }
        actor: { type: [string, "null"], description: "The person (a login). For meta.saved, the author's name." }
        machine: { type: [string, "null"], description: The credential's name (the machine or sandbox). }
        summary:
          type: [object, "null"]
          description: |
            Per kind:
            - push, branch.opened: `commits` (new commits in this push; for a
              new branch, those not on main), `head_title`, `head`, `before`.
              `commits` and `head_title` arrive a moment after the push (the
              branch-facts job adds them); null when they could not be read.
              `commits_more`: true when a first push of main had more than 250.
            - branch.deleted: `before`.
            - merged: `merge_commit`, `forced`, `title` (the branch's), `head`.
            - review: `verdict`, `comments` (a count), `head`.
            - status: `context`, `state`, `description`, `target_url`, `sha`,
              `duration_s` (from the run's first `pending` to this state; null
              without one), `app` (the CI service that reported it, null when
              a member posted it; `actor` is then that member, else null).
            - worktree.reported, worktree.removed: `path`, `worktree` (its id).
            - meta.saved: `path`, `version`, `deleted`.
    FeedSummary:
      type: object
      description: A monorepo's one line on the home.
      required: [last_activity_at, worktrees_active, machines_active, needs, members, large, repos, open_branches, at]
      properties:
        last_activity_at: { type: [string, "null"], format: date-time, description: Its newest activity line. }
        worktrees_active: { type: integer, description: Worktrees named in the hellos of open follower sockets. }
        machines_active: { type: integer, description: Machines with an open follower socket that said hello. }
        needs:
          type: object
          required: [ready, conflicts, failing]
          properties:
            ready: { type: integer }
            conflicts: { type: integer }
            failing: { type: integer }
        members: { type: integer }
        large: { type: boolean, description: "More than 100 members: its lines are read on demand, not copied to feeds." }
        repos: { type: integer, description: "Its projects (code repos; the meta layer's own repo is not counted). A plain repo has 1." }
        open_branches: { type: integer, description: "Open branches across those projects (not merged, not deleted, main not counted)." }
        at: { type: string, format: date-time, description: When the monorepo computed it. }
    MonorepoSummary:
      allOf:
        - $ref: "#/components/schemas/Monorepo"
        - type: object
          description: "listMonorepos with ?summary=1. Nulls until the person's feed has the monorepo's line."
          properties:
            last_activity_at: { type: [string, "null"], format: date-time }
            worktrees_active: { type: [integer, "null"] }
            machines_active: { type: [integer, "null"] }
            needs:
              type: [object, "null"]
              properties:
                ready: { type: integer }
                conflicts: { type: integer }
                failing: { type: integer }
            members: { type: [integer, "null"] }
            large: { type: [boolean, "null"] }
            repos: { type: [integer, "null"] }
            open_branches: { type: [integer, "null"] }
    NeedRow:
      type: object
      required: [monorepo, monorepo_id, repo, repo_path, branch, head, author, pushed_machine, state, checks, updated_at]
      properties:
        monorepo: { type: string, description: "`owner/name`." }
        monorepo_id: { type: string }
        repo: { type: string }
        repo_path: { type: string }
        branch: { type: string }
        title: { type: [string, "null"] }
        head: { type: string }
        author: { type: [string, "null"], description: The user whose first push made the branch. }
        pushed_machine: { type: [string, "null"], description: The credential that last pushed it. }
        state: { type: string, enum: [ready, conflicts, failing] }
        checks:
          type: object
          properties:
            state: { type: string }
            failing: { type: array, items: { type: string }, description: Contexts that failed or errored. }
        updated_at: { type: [string, "null"], format: date-time, description: The last push. }
    Commit:
      type: object
      required: [sha, parents, title, message, author, committer, trailers]
      properties:
        sha: { type: string }
        parents:
          type: array
          items: { type: string }
        title: { type: string, description: The message's first line. }
        message: { type: string, description: "The full message, at most 4,096 characters." }
        author:
          type: object
          properties:
            name: { type: [string, "null"] }
            email: { type: [string, "null"] }
            date: { type: [string, "null"], format: date-time }
        committer:
          type: object
          properties:
            name: { type: [string, "null"] }
            email: { type: [string, "null"] }
            date: { type: [string, "null"], format: date-time }
        trailers:
          type: object
          required: [agent, worktree, machine]
          properties:
            agent: { type: [string, "null"] }
            worktree: { type: [string, "null"] }
            machine: { type: [string, "null"] }
        co_authors:
          type: array
          description: "`Co-authored-by: Name <email>` lines from the message's trailers (its last paragraph), each once, as git and GitHub read them."
          items:
            type: object
            required: [name, email]
            properties:
              name: { type: string }
              email: { type: [string, "null"] }
    Member:
      type: object
      required: [login, name, picture_url, role, added_at, last_active_at]
      properties:
        login: { type: string }
        name: { type: [string, "null"], description: "The user's display name, if known." }
        picture_url: { type: [string, "null"], description: "As on User: their profile picture, or null (the web draws one)." }
        role: { $ref: "#/components/schemas/MemberRole" }
        added_at: { type: string, format: date-time }
        added_by: { type: [string, "null"] }
        last_active_at:
          type: [string, "null"]
          format: date-time
          description: >-
            The newest last use of any of their credentials (written at most
            once a minute per credential); null if none was ever used.
    Repo:
      type: object
      required: [monorepo, name, path, default_branch, clone_url, created_at]
      properties:
        monorepo: { type: string, description: "The monorepo's `owner/name`." }
        name: { type: string, description: The repo's id in URLs (its path with `/` turned into `-`). }
        path: { type: string, description: "`projects/web`, or `.` for a plain repo." }
        description: { type: [string, "null"] }
        default_branch: { type: string, description: Always `main` for now. }
        clone_url:
          type: string
          description: "The git door URL: `https://<host>/<owner>/<monorepo>/<name>.git`, or `https://<host>/<owner>/<name>.git` for a plain repo."
        required_checks:
          type: array
          description: Read from `.pando/pando.toml` on main when the repo is fetched one at a time (getRepo); left out of lists.
          items: { type: string }
        created_at: { type: string, format: date-time }
        created_by: { type: string }
    Branch:
      type: object
      required: [name, head, state, checks]
      properties:
        name: { type: string }
        head: { type: string }
        base:
          type: [string, "null"]
          description: The merge base with the default branch; null when there is none.
        author:
          type: [string, "null"]
          description: The user whose first push (or createBranch) made the branch.
        title: { type: [string, "null"] }
        description: { type: [string, "null"] }
        ahead:
          type: [integer, "null"]
          description: Commits on the branch that are not on the default branch.
        behind:
          type: [integer, "null"]
          description: Commits on the default branch that are not on the branch.
        mergeable:
          type: string
          enum: [clean, conflicts, up_to_date, unknown, pending]
          description: "From the merge engine's dry run. `up_to_date`: the branch adds nothing. `pending`: not yet computed for the current main and head (see `last_mergeable`)."
        stale: { type: boolean, description: "True while ahead, behind, base and mergeable are not yet for the current main and head." }
        last_mergeable: { type: [string, "null"], description: "When stale: the last known mergeable answer." }
        facts_at: { type: [string, "null"], format: date-time, description: When the facts were computed. }
        checks: { $ref: "#/components/schemas/Checks" }
        state:
          type: string
          enum: [open, merged]
          description: "`merged` when the branch's current head was landed by a Pando merge."
        merge_commit: { type: [string, "null"] }
        merged_by: { type: [string, "null"], description: "The user who merged (state merged only)." }
        merged_at: { type: [string, "null"], format: date-time }
        merged_machine: { type: [string, "null"], description: "The name of the credential used to merge: the machine or sandbox." }
        merged_agent: { type: [string, "null"], description: "The agent that merged, from X-Pando-Agent, if one said so." }
        pushed_machine: { type: [string, "null"], description: "The name of the credential that last pushed the branch: the machine or sandbox." }
        forced: { type: [boolean, "null"], description: "True when the merge went past red or missing checks with force=1." }
        created_at: { type: [string, "null"], format: date-time }
        updated_at: { type: [string, "null"], format: date-time }
    CiState:
      type: string
      enum: [queued, running, blocked, passed, failed, canceled, skipped]
      description: "One vocabulary for every service. Buildkite's scheduled and waiting are queued, failing and canceling are running, not_run and broken are skipped; `service_state` keeps the service's own word."
    CiConnection:
      type: object
      required: [id, service, organization, web_url, webhook_url, token, created_at, created_by, last_event, last_refused]
      properties:
        id: { type: string }
        service: { type: string, enum: [buildkite] }
        organization: { type: string }
        web_url: { type: string, description: The organization on the service. }
        webhook_url: { type: string, description: The URL to paste into the service's webhook settings. }
        token: { type: string, enum: [worker_secret, stored], description: "Where its REST token comes from: the Worker secret BUILDKITE_API_TOKEN at launch." }
        created_at: { type: string, format: date-time }
        created_by: { type: string }
        last_event:
          type: [object, "null"]
          description: The last webhook that passed its check.
          properties:
            at: { type: string, format: date-time }
            event: { type: [string, "null"] }
            result: { type: [string, "null"], description: "`recorded`, or `ignored: <reason>`." }
        last_refused:
          type: [object, "null"]
          description: The last webhook refused (a wrong token or signature), recorded at most every 10 s.
          properties:
            at: { type: string, format: date-time }
            reason: { type: [string, "null"] }
    CiPipeline:
      type: object
      required: [connection, service, slug, name, repo, web_url, last_build]
      properties:
        connection: { type: string }
        service: { type: string }
        slug: { type: string }
        name: { type: string }
        repo: { type: [string, "null"], description: The repo it builds. }
        repo_path: { type: [string, "null"] }
        web_url: { type: string }
        default_branch: { type: [string, "null"] }
        hook_id: { type: [string, "null"], description: "The buildkite hook that starts its builds on push, if any." }
        required_checks:
          type: array
          description: Its repo's required checks (from `.pando/pando.toml`).
          items: { type: string }
        last_build:
          oneOf:
            - $ref: "#/components/schemas/CiBuild"
            - type: "null"
    CiBuild:
      type: object
      required: [id, service, connection, pipeline, number, repo, sha, state, service_state, created_at]
      properties:
        id: { type: string, description: "Pando's id (`cib_...`)." }
        service: { type: string }
        connection: { type: string }
        pipeline: { type: string }
        number: { type: integer }
        repo: { type: string }
        repo_path: { type: [string, "null"] }
        sha: { type: [string, "null"], description: Null when the service built no fixed commit. }
        branch: { type: [string, "null"] }
        message: { type: [string, "null"] }
        state: { $ref: "#/components/schemas/CiState" }
        service_state: { type: string }
        web_url: { type: [string, "null"] }
        pushed_by: { type: [string, "null"], description: "Who pushed the commit (a login), from Pando's own records; never the service's creator." }
        created_at: { type: [string, "null"], format: date-time }
        started_at: { type: [string, "null"], format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
        duration_s: { type: [integer, "null"] }
        rebuilt_from: { type: [string, "null"], description: The service's id of the build this one rebuilt. }
    CiJob:
      type: object
      required: [id, build, type, state, service_state, check]
      properties:
        id: { type: string, description: The service's job id. }
        build: { type: string }
        name: { type: [string, "null"] }
        step_key: { type: [string, "null"] }
        type: { type: string, description: "`script`, `trigger` or `manual`." }
        state: { $ref: "#/components/schemas/CiState" }
        service_state: { type: string }
        exit_status: { type: [integer, "null"] }
        soft_failed: { type: boolean }
        retried: { type: boolean, description: A newer job replaced it (Retry). }
        web_url: { type: [string, "null"] }
        created_at: { type: [string, "null"], format: date-time }
        started_at: { type: [string, "null"], format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
        duration_s: { type: [integer, "null"] }
        check: { type: [string, "null"], description: "The check (status context) it reports, its step key; null for jobs that report none." }
    CiAnnotation:
      type: object
      properties:
        id: { type: [string, "null"] }
        context: { type: [string, "null"] }
        style: { type: [string, "null"], description: "success, info, warning or error." }
        body_html: { type: string, description: "HTML a pipeline wrote: sanitise it before showing it." }
        created_at: { type: [string, "null"], format: date-time }
        updated_at: { type: [string, "null"], format: date-time }
    CiArtifact:
      type: object
      properties:
        id: { type: string }
        job: { type: [string, "null"], description: The job that uploaded it. }
        path: { type: [string, "null"] }
        filename: { type: [string, "null"] }
        dirname: { type: [string, "null"] }
        mime_type: { type: [string, "null"] }
        size: { type: [integer, "null"] }
        sha1sum: { type: [string, "null"] }
        state: { type: [string, "null"] }
    StatusState:
      type: string
      enum: [pending, success, failure, error]
    Status:
      type: object
      required: [sha, context, state, created_at]
      properties:
        sha: { type: string }
        context: { type: string }
        state: { $ref: "#/components/schemas/StatusState" }
        target_url: { type: [string, "null"] }
        description: { type: [string, "null"] }
        creator:
          type: string
          description: "The member who posted it (a login); `app:<slug>` for a status posted with a status token or by a CI integration; `hook:<hook id>` for a status token from a web hook with no app."
        app:
          type: [string, "null"]
          description: "The CI service that reported it (`buildkite`, `github-actions`, ...), stamped by Pando from a status token or a CI integration, never from the body or `target_url`. Null when a member posted it with their own credential. The web shows the service's mark for a slug it knows."
        created_at: { type: string, format: date-time }
    Checks:
      type: object
      required: [sha, state, required, statuses]
      description: GitHub's combined status, plus the required contexts and which are missing.
      properties:
        sha: { type: [string, "null"] }
        state:
          type: string
          enum: [success, pending, failure, error, missing]
          description: "`success` when the merge gate passes; `missing` when a required context has not reported."
        required:
          type: array
          items: { type: string }
        missing:
          type: array
          items: { type: string }
        statuses:
          type: array
          description: The latest status per context.
          items: { $ref: "#/components/schemas/Status" }
    Diff:
      type: object
      required: [base_branch, base, head, merge_base, files, truncated]
      properties:
        base_branch: { type: string, description: The default branch. }
        base: { type: string, description: The default branch's head. }
        head: { type: string, description: The branch head. }
        merge_base: { type: string, description: Where the diff starts (three-dot). }
        truncated:
          type: boolean
          description: "True when any file has `patch_omitted: budget`."
        stats:
          type: object
          properties:
            files: { type: integer }
            additions: { type: integer }
            deletions: { type: integer }
        files:
          type: array
          items: { $ref: "#/components/schemas/DiffFile" }
    DiffFile:
      type: object
      required: [path, status, binary]
      properties:
        path: { type: string }
        old_path: { type: string, description: Only for `renamed`. }
        status:
          type: string
          enum: [added, modified, deleted, renamed]
        old_sha: { type: [string, "null"] }
        new_sha: { type: [string, "null"] }
        old_mode: { type: [string, "null"] }
        new_mode: { type: [string, "null"] }
        binary: { type: boolean }
        additions: { type: [integer, "null"] }
        deletions: { type: [integer, "null"] }
        hunks:
          type: array
          description: Only with `hunks=1`.
          items: { $ref: "#/components/schemas/Hunk" }
        patch_omitted:
          type: string
          enum: [binary, too_large, budget]
    Hunk:
      type: object
      required: [old_start, old_lines, new_start, new_lines, lines]
      properties:
        old_start: { type: integer }
        old_lines: { type: integer }
        new_start: { type: integer }
        new_lines: { type: integer }
        lines:
          type: array
          description: Each line starts with `+`, `-`, ` `, or `\` (no newline at end of file).
          items: { type: string }
    ReviewComment:
      type: object
      required: [path, body]
      properties:
        path: { type: string }
        line: { type: integer, description: A line in the new file. }
        side: { type: string, enum: [new, old], default: new }
        body: { type: string }
    Review:
      type: object
      required: [id, branch, head, verdict, author, created_at]
      properties:
        id: { type: string }
        branch: { type: string }
        head: { type: string }
        verdict: { type: string, enum: [comment, request_changes, approve] }
        body: { type: [string, "null"] }
        comments:
          type: array
          items: { $ref: "#/components/schemas/ReviewComment" }
        author: { type: string }
        created_at: { type: string, format: date-time }
    MergeResult:
      type: object
      required: [status, branch, head]
      properties:
        status:
          type: string
          enum: [merged, up_to_date]
        branch: { type: string }
        head: { type: string, description: The branch head that was merged. }
        sha: { type: string, description: The merge commit (or the default branch head for `up_to_date`). }
        base_before: { type: string, description: The default branch head before the merge. }
        merge_base: { type: string }
        forced: { type: boolean }
        merged_by: { type: string }
    HookEvent:
      type: string
      enum: [push, branch.opened, merged]
      description: "`branch.opened`: the first push of a branch. `push`: any push through the door that moves or deletes a branch. `merged`: a Pando merge landed a branch."
    Hook:
      type: object
      required: [id, type, events, active, created_at]
      properties:
        id: { type: string }
        type: { type: string, enum: [web, buildkite] }
        url: { type: [string, "null"] }
        events:
          type: array
          items: { $ref: "#/components/schemas/HookEvent" }
        buildkite:
          type: [object, "null"]
          properties:
            organization: { type: string }
            pipeline: { type: string }
        app:
          type: [string, "null"]
          description: "The app its status tokens stamp: `buildkite` for a buildkite hook, a web hook's own `app`, or null."
        active: { type: boolean }
        created_at: { type: string, format: date-time }
        created_by: { type: string }
    Delivery:
      type: object
      required: [id, hook_id, event, status, attempts, created_at]
      properties:
        id: { type: string }
        hook_id: { type: string }
        event: { $ref: "#/components/schemas/HookEvent" }
        seq: { type: [integer, "null"], description: "The event stream's seq for the change. One delivery per (hook, event, seq): a retry, a redeliver or a replay reuses it." }
        status:
          type: string
          enum: [queued, retrying, delivered, failed, dead]
          description: "`queued`: waiting for its first try. `retrying`: the last try failed; `next_attempt_at` says when the next is. `dead`: the fifth try failed, or its hook or repo was deleted (redeliver to try again). `failed` appears only on deliveries from before 2026-10-03, between the fifth try and `dead`."
        attempts: { type: integer }
        response_code: { type: [integer, "null"] }
        error: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        last_attempt_at: { type: [string, "null"], format: date-time }
        next_attempt_at: { type: [string, "null"], format: date-time }
        recent_attempts:
          type: array
          description: The last 10 tries, newest first.
          items:
            type: object
            properties:
              n: { type: integer }
              at: { type: string, format: date-time }
              response_code: { type: [integer, "null"] }
              error: { type: [string, "null"] }
              ms: { type: integer }
    Machine:
      type: object
      required: [login, credential_id, name, kind, connected, connected_at, last_activity, worktrees, updated_at]
      properties:
        login: { type: string, description: The person. }
        credential_id: { type: string, description: "With login, the machine's key." }
        name: { type: string, description: "The credential's name: the machine as people see it." }
        kind: { type: [string, "null"], enum: [machine, sandbox, bootstrap, browser, null] }
        connected: { type: boolean, description: "An event socket of this credential said hello and is open." }
        connected_at: { type: [string, "null"], format: date-time }
        last_activity:
          type: [object, "null"]
          description: Its latest activity line in this monorepo.
          properties:
            seq: { type: integer }
            at: { type: string, format: date-time }
            kind: { type: string }
            repo: { type: [string, "null"] }
            repo_path: { type: [string, "null"] }
            branch: { type: [string, "null"] }
            summary: { type: [object, "null"], description: As FeedEvent.summary. }
        worktrees:
          type: array
          description: "The worktrees its last hello named; repo, branch and path from the worktree registry (null when not reported there)."
          items:
            type: object
            properties:
              id: { type: string }
              repo: { type: [string, "null"] }
              branch: { type: [string, "null"] }
              path: { type: [string, "null"] }
        updated_at: { type: string, format: date-time }
    Worktree:
      type: object
      required: [id, repo, branch, path, machine, kind, reported_by, created_at, last_seen_at]
      properties:
        id: { type: string }
        repo: { type: string }
        branch: { type: string }
        path: { type: string }
        machine: { type: string }
        agent: { type: [string, "null"] }
        kind: { type: string, enum: [fuse, sparse, fskit] }
        reported_by: { type: string, description: The user whose credential reported it. }
        created_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
    HookPayload:
      type: object
      required: [event, delivery_id, occurred_at, monorepo, monorepo_id, repo, ref, clone_url]
      properties:
        event: { $ref: "#/components/schemas/HookEvent" }
        delivery_id: { type: string }
        occurred_at: { type: string, format: date-time }
        monorepo: { type: string, description: "`owner/name` when the delivery was made." }
        monorepo_id: { type: string, description: "The monorepo's permanent id: a stable key across renames." }
        repo: { type: string }
        branch: { type: string }
        ref: { type: string, description: "`refs/heads/<branch>`" }
        head: { type: string, description: The new head; all zeros when the branch was deleted. }
        before: { type: string, description: The old head; all zeros for a new branch. }
        base: { type: [string, "null"], description: The merge base with the default branch. }
        title: { type: [string, "null"] }
        description: { type: [string, "null"] }
        author: { type: [string, "null"], description: The branch's author (a user). }
        pusher: { type: string, description: "The user who pushed; for `merged`, who merged." }
        seq: { type: [integer, "null"], description: "The event stream's seq for this change: drop repeats, sort by it." }
        merge_commit: { type: string, description: Only for `merged`. }
        diff_url: { type: string }
        clone_url: { type: string, description: The git door URL. Clone it with `read_token`. }
        read_token:
          type: string
          description: "A read-only token for this one repo, valid 30 minutes, minted for this delivery. Use it as `Authorization: Bearer <read_token>` against `clone_url`."
        read_token_expires_at: { type: string, format: date-time }
        status_url:
          type: string
          description: "`POST` a commit status here for `head`, with `status_token` or a member's credential."
        status_token:
          type: string
          description: "Posts statuses for `head` in this repo for 24 hours, stamped with the hook's `app` (see createStatus). Absent when the Worker secret PANDO_STATUS_SECRET is not set or the branch was deleted."
        status_token_expires_at: { type: string, format: date-time }
